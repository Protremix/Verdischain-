# Codemagic Configuration for Verdis Wallet — iOS + Android

workflows:
  ios-build:
    name: Verdis Wallet iOS
    max_build_duration: 30
    integrations:
      app_store_connect: Protremix
    environment:
      groups:
        - Protremix
      vars:
        BUNDLE_ID: com.verdis.wallet
        APP_NAME: Verdis Wallet
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Set up code signing
        script: |
          keychain initialize
          
          # Generate a new 2048-bit RSA private key for the certificate
          # fetch-signing-files needs this to create/save the signing certificate
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_private_key -q -N ""
          echo "Generated certificate private key"
          
          # Resolve the @file: prefix for the API key
          API_KEY_PATH="${APP_STORE_CONNECT_PRIVATE_KEY#@file:}"
          echo "API key path: $API_KEY_PATH"
          
          # Fetch signing files — pass both the API key AND the certificate private key
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_DEVELOPMENT \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$API_KEY_PATH" \
            --certificate-key /tmp/cert_private_key
          
          xcode-project use-profiles

      - name: Install CocoaPods
        script: |
          rm -f ios/Flutter/Generated.xcconfig
          flutter precache --ios
          flutter pub get
          cd ios && pod install

      - name: Build iOS IPA (Development)
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.dSYM.zip
      - $HOME/Library/Developer/Xcode/Archives/*.xcarchive

    publishing:
      email:
        recipients:
          - roygordons15@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-build:
    name: Verdis Wallet Android
    max_build_duration: 20
    environment:
      groups:
        - Protremix
      vars:
        PACKAGE_NAME: com.verdis.wallet
      flutter: stable
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Set up Android signing
        script: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/verdis-release.jks
          cat > /tmp/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=/tmp/verdis-release.jks
          EOF
          cp /tmp/key.properties android/key.properties
          cp /tmp/verdis-release.jks android/app/verdis-release.jks

      - name: Build Android APK/AAB
        script: |
          flutter build appbundle --release

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - roygordons15@gmail.com
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
