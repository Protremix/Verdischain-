# Codemagic Configuration for Verdis Wallet — iOS + Android
#
# Updated: August 21, 2026 — Arlo (Chief Engineer)
# Fixes: branch pattern (main→master), Podfile/Info.plist alignment (iOS 14.0),
#       email recipient, streamlined code signing, documentation comments
#
# PREREQUISITES (do NOT create account — Rojs must authorize):
#   1. Codemagic account linked to GitHub repo (Protremix/Verdischain-)
#   2. App Store Connect integration configured in Codemagic UI
#   3. Environment group "Protremix" with:
#      - APP_STORE_CONNECT_KEY_IDENTIFIER (Key ID: 458H542TK5)
#      - APP_STORE_CONNECT_ISSUER_ID (Issuer ID: 4148739c-436f-4b67-a527-4476eb79a43b)
#      - APP_STORE_CONNECT_PRIVATE_KEY (.p8 file content)
#      - CERTIFICATE_PRIVATE_KEY (Apple Distribution cert .p12 password)
#   4. Android signing keystore configured in environment group
#
# SECURITY:
#   - No hardcoded credentials in this file
#   - All secrets reference Codemagic environment variables
#   - API keys loaded from App Store Connect integration
#   - No private keys stored in repo

workflows:
  # ============================================================
  # iOS BUILD WORKFLOW
  # ============================================================
  ios-build:
    name: Verdis Wallet iOS
    max_build_duration: 40
    integrations:
      app_store_connect: Protremix
    environment:
      groups:
        - Protremix
      vars:
        BUNDLE_ID: com.verdis.wallet
        APP_NAME: Verdis Wallet
        # Minimum iOS version — aligned between Podfile and Info.plist
        MIN_IOS_VERSION: "14.0"
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        # FIX: repo uses 'master', not 'main'
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Align iOS minimum version (Podfile/Info.plist fix)
        script: |
          # Fix Podfile (was 15.0) and Info.plist (was 13.0) — align to 14.0
          sed -i '' "s/platform :ios, '[0-9.]'/platform :ios, '14.0'/" ios/Podfile
          plutil -replace MinimumOSVersion -string "14.0" ios/Runner/Info.plist
          echo "Podfile platform:"
          grep "platform :ios" ios/Podfile
          echo "Info.plist MinimumOSVersion:"
          plutil -extract MinimumOSVersion raw ios/Runner/Info.plist

      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Build and test on iOS Simulator
        script: |
          # mobile_scanner MLKit lacks arm64 sim slices on some iOS versions
          cp pubspec.yaml pubspec.yaml.bak
          sed -i '' 's/  mobile_scanner: ^5.2.3/  #mobile_scanner: ^5.2.3/' pubspec.yaml
          flutter pub get

          # Build simulator app
          flutter build ios --simulator --no-codesign --debug || true

          # Restore pubspec
          cp pubspec.yaml.bak pubspec.yaml
          flutter pub get

          # Boot simulator and take screenshots
          SIM_ID=$(xcrun simctl list devices available | grep 'iPhone' | head -1 | grep -oE '[A-F0-9-]{36}')
          if [ -z "$SIM_ID" ]; then
            echo "No simulator available — skipping screenshot capture"
            exit 0
          fi
          echo "Using simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_ID" -b

          APP_PATH=$(find build/ios/iphonesimulator -name 'Runner.app' 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ]; then
            xcrun simctl install "$SIM_ID" "$APP_PATH"
            xcrun simctl launch "$SIM_ID" com.verdis.wallet
            SCREENSHOT_DIR="$CM_BUILD_DIR/simulator-screenshots"
            mkdir -p "$SCREENSHOT_DIR"
            sleep 10
            xcrun simctl io "$SIM_ID" screenshot "$SCREENSHOT_DIR/01-launch.png"
            sleep 5
            xcrun simctl io "$SIM_ID" screenshot "$SCREENSHOT_DIR/02-onboarding.png"
            sleep 5
            xcrun simctl io "$SIM_ID" screenshot "$SCREENSHOT_DIR/03-dashboard.png"
            echo "Screenshots saved to $SCREENSHOT_DIR"
          else
            echo "Runner.app not found — skipping screenshots"
          fi

      - name: Set up code signing
        script: |
          keychain initialize

          # Fetch signing files from App Store Connect
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          # Apply provisioning profiles
          xcode-project use-profiles

          # Verify signing identity
          IDENTITY=$(security find-identity -v -p codesigning | grep "Apple Distribution" || true)
          if [ -z "$IDENTITY" ]; then
            echo "ERROR: No Apple Distribution identity found"
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "Signing identity: $IDENTITY"

      - name: Install CocoaPods
        script: |
          rm -f ios/Flutter/Generated.xcconfig
          flutter precache --ios
          flutter pub get
          cd ios && pod install && cd ..

      - name: Build iOS IPA (App Store)
        script: |
          flutter clean
          flutter pub get
          cd ios && pod install && cd ..

          # Use Codemagic-generated export options (from signing setup)
          flutter build ipa --release \
            --export-options-plist /Users/builder/export_options.plist

          # Verify IPA was created
          IPA_FILE=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No IPA file found"
            find build/ios -name "*.ipa" 2>/dev/null
            exit 1
          fi
          echo "IPA built: $IPA_FILE"
          ls -la "$IPA_FILE"

      - name: Upload to TestFlight
        script: |
          IPA_FILE=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Uploading: $IPA_FILE"

          KEY_ID="${APP_STORE_CONNECT_KEY_IDENTIFIER:-458H542TK5}"
          ISSUER_ID="${APP_STORE_CONNECT_ISSUER_ID:-4148739c-436f-4b67-a527-4476eb79a43b}"

          # Find the API key file
          KEY_FILE=""
          for f in /Users/builder/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
                    /Users/builder/.appstoreconnect/private_keys/*.p8 \
                    /tmp/AuthKey_${KEY_ID}.p8; do
            if [ -f "$f" ]; then
              KEY_FILE="$f"
              break
            fi
          done

          if [ -z "$KEY_FILE" ]; then
            echo "ERROR: No .p8 API key found"
            find / -name "AuthKey_*.p8" 2>/dev/null | head -5
            exit 1
          fi

          echo "Using API key: $KEY_FILE"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose 2>&1

          echo "Upload complete — check App Store Connect for processing status"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.dSYM.zip
      - $HOME/Library/Developer/Xcode/Archives/*.xcarchive
      - $CM_BUILD_DIR/simulator-screenshots/*.png

    publishing:
      email:
        recipients:
          - roygordons15@gmail.com

  # ============================================================
  # ANDROID BUILD WORKFLOW
  # ============================================================
  android-build:
    name: Verdis Wallet Android
    max_build_duration: 30
    environment:
      groups:
        - Protremix
      vars:
        PACKAGE_NAME: com.verdis.wallet
      flutter: 3.41.7
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        # FIX: repo uses 'master', not 'main'
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Set up Android signing
        script: |
          # Decode keystore from environment variable (base64 encoded)
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > /tmp/verdis-upload-key.jks
            echo "Keystore decoded"
          else
            echo "WARNING: CM_KEYSTORE not set — using existing keystore"
          fi

          # Create key.properties
          cat > android/key.properties << KEYEOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/verdis-upload-key.jks
          KEYEOF

      - name: Build Android App Bundle (AAB)
        script: |
          flutter build appbundle --release

          # Verify AAB was created
          AAB_FILE=$(ls build/app/outputs/bundle/release/*.aab 2>/dev/null | head -1)
          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: No AAB file found"
            exit 1
          fi
          echo "AAB built: $AAB_FILE"
          ls -la "$AAB_FILE"

      - name: Upload to Google Play Internal Testing
        script: |
          # Uses Codemagic Google Play integration
          # Track: internal testing
          # Track URL: https://play.google.com/apps/internaltest/4701679756853288782
          echo "Google Play upload configured via Codemagic UI integration"

    artifacts:
      - build/app/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - roygordons15@gmail.com
