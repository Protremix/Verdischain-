# Codemagic Configuration for Verdis Wallet iOS builds
# Documentation: https://docs.codemagic.io/yaml/yaml-getting-started/
#
# Setup requirements:
# 1. Sign up at https://codemagic.io (free tier: 500 min/month)
# 2. Add this repo (Protremix/Verdischain-)
# 3. Create an App Store Connect API key:
#    - Go to https://appstoreconnect.apple.com/access/integrations/api
#    - Generate a key with "App Manager" role
#    - Save the .p8 file, Issuer ID, and Key ID
# 4. Add these as environment variables in Codemagic (App > Settings > Environment variables):
#    - APP_STORE_CONNECT_PRIVATE_KEY (contents of .p8 file)
#    - APP_STORE_CONNECT_ISSUER_ID
#    - APP_STORE_CONNECT_KEY_IDENTIFIER
#    - APP_STORE_TEAM_ID (your Apple Developer Team ID, found in Apple Developer > Account > Membership)
# 5. Put the above vars in a group called "apple" (App > Settings > Environment variable groups)
# 6. Push to main branch to trigger a build

workflows:
  ios-build:
    name: Verdis Wallet iOS
    max_build_duration: 30
    environment:
      groups:
        - apple
      vars:
        BUNDLE_ID: com.verdis.wallet
        APP_NAME: Verdis Wallet
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Set up code signing
        script: |
          # Initialize temporary keychain
          keychain initialize

          # Fetch signing files from App Store Connect
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          # Use the fetched profiles
          xcode-project use-profiles

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.dSYM.zip
      - $HOME/Library/Developer/Xcode/Archives/*.xcarchive

    publishing:
      email:
        recipients:
          - roygordons15@gmail.com
