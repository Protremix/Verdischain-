# Codemagic Configuration for Verdis Wallet — iOS + Android

workflows:
  ios-build:
    name: Verdis Wallet iOS
    max_build_duration: 30
    integrations:
      app_store_connect: Protremix
    environment:
      groups:
        - Protremix
      vars:
        BUNDLE_ID: com.verdis.wallet
        APP_NAME: Verdis Wallet
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Debug and set up code signing
        script: |
          # Debug: show what credentials are available (masked)
          echo "=== Credential Check ==="
          echo "ISSUER_ID length: ${#APP_STORE_CONNECT_ISSUER_ID}"
          echo "ISSUER_ID first 8: ${APP_STORE_CONNECT_ISSUER_ID:0:8}"
          echo "KEY_ID length: ${#APP_STORE_CONNECT_KEY_ID}"
          echo "KEY_ID value: '$APP_STORE_CONNECT_KEY_ID'"
          echo "PRIVATE_KEY length: ${#APP_STORE_CONNECT_PRIVATE_KEY}"
          echo "PRIVATE_KEY first 30: ${APP_STORE_CONNECT_PRIVATE_KEY:0:30}"
          echo "PRIVATE_KEY last 30: ${APP_STORE_CONNECT_PRIVATE_KEY: -30}"
          echo "PRIVATE_KEY contains BEGIN: $(echo $APP_STORE_CONNECT_PRIVATE_KEY | grep -c 'BEGIN')"
          echo "PRIVATE_KEY contains END: $(echo $APP_STORE_CONNECT_PRIVATE_KEY | grep -c 'END')"
          
          # Also check CM_ prefixed vars
          echo "CM_ISSUER_ID length: ${#CM_APP_STORE_CONNECT_ISSUER_ID}"
          echo "CM_KEY_ID length: ${#CM_APP_STORE_CONNECT_KEY_ID}"
          echo "CM_PRIVATE_KEY length: ${#CM_APP_STORE_CONNECT_PRIVATE_KEY}"
          
          # Check if API key file exists
          echo "API_KEY_PATH: ${APP_STORE_CONNECT_API_KEY_PATH:-not set}"
          ls -la ${APP_STORE_CONNECT_API_KEY_PATH:-/nonexistent} 2>&1 || true
          
          # Initialize keychain
          keychain initialize
          
          # Try writing private key to file and using --private-key flag
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/authkey.p8
            echo "Wrote private key to /tmp/authkey.p8 ($(wc -c < /tmp/authkey.p8) bytes)"
            
            # Try with explicit flags
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_DEVELOPMENT \
              --create \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --key-id "$APP_STORE_CONNECT_KEY_ID" \
              --private-key /tmp/authkey.p8 2>&1 || echo "fetch-signing-files failed with explicit flags"
          else
            echo "No private key found in env vars"
            # Try integration-based approach
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_DEVELOPMENT \
              --create 2>&1 || echo "fetch-signing-files failed with integration"
          fi
          
          # Set up automatic signing
          cd ios
          sed -i '' 's/CODE_SIGN_STYLE = Manual/CODE_SIGN_STYLE = Automatic/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = \"Manual\"/CODE_SIGN_STYLE = Automatic/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*/DEVELOPMENT_TEAM = 84399KX4RA/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIED = YES/PROVISIONING_PROFILE_SPECIFIED = NO/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE = \"[^\"]*\"/PROVISIONING_PROFILE = \"\"/g' Runner.xcodeproj/project.pbxproj
          echo "Signing config updated"
          xcode-project use-profiles || true

      - name: Install CocoaPods
        script: |
          rm -f ios/Flutter/Generated.xcconfig
          flutter precache --ios
          flutter pub get
          cd ios && pod install

      - name: Build iOS IPA (Development)
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.dSYM.zip
      - $HOME/Library/Developer/Xcode/Archives/*.xcarchive

    publishing:
      email:
        recipients:
          - roygordons15@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-build:
    name: Verdis Wallet Android
    max_build_duration: 20
    environment:
      groups:
        - Protremix
      vars:
        PACKAGE_NAME: com.verdis.wallet
      flutter: stable
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Set up Android signing
        script: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/verdis-release.jks
          cat > /tmp/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=/tmp/verdis-release.jks
          EOF
          cp /tmp/key.properties android/key.properties
          cp /tmp/verdis-release.jks android/app/verdis-release.jks

      - name: Build Android APK/AAB
        script: |
          flutter build appbundle --release

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - roygordons15@gmail.com
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
