# Codemagic Configuration for Verdis Wallet — iOS + Android

workflows:
  ios-build:
    name: Verdis Wallet iOS
    max_build_duration: 30
    integrations:
      app_store_connect: Protremix
    environment:
      groups:
        - Protremix
      vars:
        BUNDLE_ID: com.verdis.wallet
        APP_NAME: Verdis Wallet
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Set up code signing
        script: |
          keychain initialize
          
          # Revoke any existing Distribution certificates to avoid 409 conflict
          # Apple only allows ONE Distribution cert at a time
          pip3 install --quiet PyJWT cryptography 2>/dev/null
          python3 << 'PYEOF'
          import json, time, urllib.request, os
          ISSUER_ID = '4148739c-436f-4b67-a527-4476eb79a43b'
          KEY_ID = os.environ.get('APP_STORE_CONNECT_KEY_IDENTIFIER', '458H542TK5')
          # Find the private key file
          import glob
          key_files = glob.glob('/Users/builder/.appstoreconnect/private_keys/AuthKey_*.p8')
          if not key_files:
              key_files = glob.glob('/Users/builder/.appstoreconnect/private_keys/*.p8')
          if not key_files:
              print('No API key found, skipping revocation')
              exit(0)
          with open(key_files[0], 'r') as f:
              private_key = f.read()
          import jwt
          payload = {'iss': ISSUER_ID, 'iat': int(time.time()), 'exp': int(time.time()) + 900, 'aud': 'appstoreconnect-v1'}
          headers = {'kid': KEY_ID, 'typ': 'JWT', 'alg': 'ES256'}
          token = jwt.encode(payload, private_key, algorithm='ES256', headers=headers)
          if isinstance(token, bytes): token = token.decode('utf-8')
          req = urllib.request.Request('https://api.appstoreconnect.apple.com/v1/certificates',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'})
          resp = urllib.request.urlopen(req)
          data = json.loads(resp.read())
          certs = data.get('data', [])
          print(f'Found {len(certs)} existing certificates')
          for cert in certs:
              if cert['attributes'].get('certificateType') in ('DISTRIBUTION', 'IOS_DISTRIBUTION'):
                  cert_id = cert['id']
                  revoke_req = urllib.request.Request(
                      f'https://api.appstoreconnect.apple.com/v1/certificates/{cert_id}',
                      method='DELETE',
                      headers={'Authorization': f'Bearer {token}'})
                  try:
                      urllib.request.urlopen(revoke_req)
                      print(f'Revoked cert {cert_id}')
                  except Exception as e:
                      print(f'Revoke failed for {cert_id}: {e}')
          PYEOF
          
          # Generate RSA key for CSR
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key -q -N ""
          export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_key)"
          
          # Create cert + profile
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          
          # CRITICAL: fetch-signing-files saves .p12 to disk but does NOT import into keychain
          # Manually import the .p12 into the keychain so xcodebuild can find it
          KEYCHAIN=$(security default-keychain | tr -d '"' | xargs)
          echo "Keychain: $KEYCHAIN"
          security unlock-keychain -p '' "$KEYCHAIN"
          
          P12_FILE=$(ls /Users/builder/Library/Developer/Xcode/UserData/Certificates/DISTRIBUTION_*.p12 2>/dev/null | head -1)
          if [ -n "$P12_FILE" ]; then
            echo "Importing certificate: $P12_FILE"
            security import "$P12_FILE" -k "$KEYCHAIN" -P '' -T /usr/bin/codesign -T /usr/bin/security -A
          else
            echo "ERROR: No .p12 file found"
            exit 1
          fi
          
          # Verify cert is in keychain
          IDENTITY=$(security find-identity -v -p codesigning | grep "Apple Distribution" || true)
          if [ -z "$IDENTITY" ]; then
            echo "ERROR: No valid Apple Distribution identity in keychain after import"
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "Identity found: $IDENTITY"
          
          xcode-project use-profiles

      - name: Install CocoaPods
        script: |
          rm -f ios/Flutter/Generated.xcconfig
          flutter precache --ios
          flutter pub get
          cd ios && pod install

      - name: Build iOS IPA (App Store)
        script: |
          cat /Users/builder/export_options.plist
          
          # Clean build to avoid "replacing existing signature" error
          flutter clean
          flutter pub get
          cd ios && pod install && cd ..
          
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.dSYM.zip
      - $HOME/Library/Developer/Xcode/Archives/*.xcarchive

    publishing:
      email:
        recipients:
          - rojsgordons@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-build:
    name: Verdis Wallet Android
    max_build_duration: 20
    environment:
      groups:
        - Protremix
      vars:
        PACKAGE_NAME: com.verdis.wallet
      flutter: stable
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Set up Android signing
        script: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/verdis-release.jks
          cat > /tmp/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=/tmp/verdis-release.jks
          EOF
          cp /tmp/key.properties android/key.properties
          cp /tmp/verdis-release.jks android/app/verdis-release.jks

      - name: Build Android APK/AAB
        script: |
          flutter build appbundle --release

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - rojsgordons@gmail.com
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
