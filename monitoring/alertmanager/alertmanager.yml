global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.verdischain.com:587'
  smtp_from: 'alerts@verdischain.com'
  smtp_auth_username: 'alerts@verdischain.com'
  smtp_auth_password: 'PLACEHOLDER_SMTP_PASSWORD'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'cluster', 'service', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-webhook'

  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts-group'
      continue: true

    - match:
        severity: warning
      receiver: 'warning-alerts-group'

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://localhost:5000/api/v1/alerts/webhook'
        send_resolved: true

  - name: 'critical-alerts-group'
    webhook_configs:
      - url: 'http://localhost:5000/api/v1/alerts/critical'
        send_resolved: true
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK_URL'
        channel: '#verdis-node-alerts-critical'
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }} - `{{ .Labels.severity }}`
            *Description:* {{ .Annotations.description }}
            *Details:*
            {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
            {{ end }}
          {{ end }}
    email_configs:
      - to: 'devops@verdischain.com'
        send_resolved: true
        headers:
          Subject: '[CRITICAL ALERT] Verdis Blockchain: {{ .CommonAnnotations.summary }}'

  - name: 'warning-alerts-group'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK_URL'
        channel: '#verdis-node-alerts-warning'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
    email_configs:
      - to: 'alerts@verdischain.com'
        send_resolved: true
        headers:
          Subject: '[WARNING] Verdis Blockchain: {{ .CommonAnnotations.summary }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']
