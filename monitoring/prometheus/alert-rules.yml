groups:
  - name: verdis_blockchain_alerts
    rules:
      - alert: VerdisBlockProductionStalled
        expr: increase(substrate_block_height{status="best"}[1m]) == 0
        for: 1m
        labels:
          severity: critical
          chain: verdis
        annotations:
          summary: "Verdis block production stalled"
          description: "No new blocks have been produced on Verdis blockchain for over 60 seconds."

      - alert: VerdisGrandpaFinalityLagging
        expr: substrate_grandpa_finality_lag > 10 or (substrate_block_height{status="best"} - substrate_block_height{status="finalized"}) > 10
        for: 1m
        labels:
          severity: critical
          chain: verdis
        annotations:
          summary: "GRANDPA finality lag high"
          description: "GRANDPA finality lag is {{ $value }} blocks (threshold: 10 blocks). Finality may be stalled."

      - alert: VerdisEpochTransitionFailure
        expr: increase(substrate_epoch_transition_count[75m]) == 0
        for: 5m
        labels:
          severity: critical
          chain: verdis
        annotations:
          summary: "Epoch transition failure detected"
          description: "No epoch transition recorded in the last 75 minutes (expected epoch length: 600 blocks / ~60 minutes)."

      - alert: VerdisNodeDown
        expr: up{job="substrate-node"} == 0
        for: 1m
        labels:
          severity: critical
          chain: verdis
        annotations:
          summary: "Verdis Substrate node is down"
          description: "Substrate node endpoint on target {{ $labels.instance }} is unreachable for over 1 minute."

      - alert: VerdisValidatorPeerCountZero
        expr: substrate_peer_count{node_role="validator"} == 0 or substrate_peer_count == 0
        for: 1m
        labels:
          severity: critical
          chain: verdis
        annotations:
          summary: "Validator node has zero peers"
          description: "Verdis validator node has 0 connected peers on network port 30333."

      - alert: VerdisRpcLatencyHigh
        expr: (rate(substrate_rpc_duration_seconds_sum[5m]) / rate(substrate_rpc_duration_seconds_count[5m])) > 0.100
        for: 2m
        labels:
          severity: warning
          chain: verdis
        annotations:
          summary: "High RPC response latency"
          description: "Average RPC request duration over 5m is {{ $value | printf \"%.3f\" }}s, exceeding 100ms threshold."

      - alert: VerdisBabeSlotFrequencyDeviation
        expr: abs(rate(substrate_block_height{status="best"}[5m]) - 0.16667) > 0.05
        for: 3m
        labels:
          severity: warning
          chain: verdis
        annotations:
          summary: "BABE slot frequency deviation"
          description: "Block production rate ({{ $value | printf \"%.3f\" }} blocks/s) deviates significantly from 6s target slot time (0.167 blocks/s)."

  - name: verdis_system_alerts
    rules:
      - alert: HighCpuUsage
        expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
        for: 5m
        labels:
          severity: warning
          chain: verdis
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is at {{ $value | printf \"%.1f\" }}% (threshold: 80%)."

      - alert: HighMemoryUsage
        expr: ((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100) > 85
        for: 5m
        labels:
          severity: warning
          chain: verdis
        annotations:
          summary: "High RAM usage on {{ $labels.instance }}"
          description: "RAM usage is at {{ $value | printf \"%.1f\" }}% (threshold: 85%)."

      - alert: LowDiskSpace
        expr: ((node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100) < 10
        for: 5m
        labels:
          severity: critical
          chain: verdis
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space available on / is at {{ $value | printf \"%.1f\" }}% (threshold: < 10%)."
