[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "evolvixos-sdk"
version = "1.0.0"
description = "EvolvixOS Developer SDK — Unified AI Gateway, Agent Framework, and Blockchain client"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "EvolvixOS", email = "dev@evolvixos.com"}]
keywords = ["evolvixos", "ai", "gateway", "agents", "blockchain", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://evolvixos.com"
Repository = "https://github.com/evolvixos/evolvixos-sdk"
Documentation = "https://evolvixos.com/monitoring/docs-api"

[tool.setuptools]
py-modules = ["evolvixos_sdk"]
