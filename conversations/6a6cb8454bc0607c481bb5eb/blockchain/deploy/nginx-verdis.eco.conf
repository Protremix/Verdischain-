# Verdis Blockchain — Nginx config for verdis.eco
# Place in /etc/nginx/sites-available/verdis.eco
# Symlink: ln -s /etc/nginx/sites-available/verdis.eco /etc/nginx/sites-enabled/
# Get SSL: certbot --nginx -d verdis.eco -d www.verdis.eco -d rpc.verdis.eco

# Main site
server {
    listen 80;
    server_name verdis.eco www.verdis.eco;

    # Landing page + dashboard + API
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # JSON-RPC endpoint (Trust Wallet / MetaMask)
    location /rpc {
        proxy_pass http://127.0.0.1:3200/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS for wallet compatibility
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        if ($request_method = OPTIONS) { return 204; }
    }
}

# RPC subdomain (optional, cleaner for wallet config)
server {
    listen 80;
    server_name rpc.verdis.eco;

    location / {
        proxy_pass http://127.0.0.1:3200/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        if ($request_method = OPTIONS) { return 204; }
    }
}
