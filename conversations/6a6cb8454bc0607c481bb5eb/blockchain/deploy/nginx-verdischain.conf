# Verdis Blockchain — Nginx config for verdischain.com
# Install: cp deploy/nginx-verdischain.conf /etc/nginx/sites-available/verdischain
# Symlink: ln -s /etc/nginx/sites-available/verdischain /etc/nginx/sites-enabled/
# SSL: certbot --nginx -d verdischain.com -d www.verdischain.com -d rpc.verdischain.com

server {
    listen 80;
    server_name verdischain.com www.verdischain.com;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /rpc {
        proxy_pass http://127.0.0.1:3200/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        if ($request_method = OPTIONS) { return 204; }
    }
}

server {
    listen 80;
    server_name rpc.verdischain.com;
    location / {
        proxy_pass http://127.0.0.1:3200/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        if ($request_method = OPTIONS) { return 204; }
    }
}
