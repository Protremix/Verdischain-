version: '3.8'
services:
  verdis:
    build: .
    container_name: verdis-node
    ports:
      - "3200:3200"
    volumes:
      - verdis-data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3200
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/api/blockchain/info"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  verdis-data:
    driver: local
