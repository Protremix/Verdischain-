<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verdis - Blockchain Explorer & Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
      margin: 0;
      padding: 24px;
    }
    header {
      border-bottom: 1px solid #1e293b;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h1 {
      color: #38bdf8;
      margin: 0 0 8px 0;
    }
    p {
      color: #94a3b8;
      margin: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .card h2 {
      margin-top: 0;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
    }
    .metric {
      font-size: 2rem;
      font-weight: bold;
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <header>
    <h1>🚀 Verdis Network Dashboard</h1>
    <p>Real-time Blockchain Explorer & Node Status</p>
  </header>

  <div class="grid">
    <div class="card">
      <h2>Block Height</h2>
      <div class="metric" id="blockHeight">1</div>
    </div>
    <div class="card">
      <h2>Active Validators</h2>
      <div class="metric" id="validators">5</div>
    </div>
    <div class="card">
      <h2>Total Supply</h2>
      <div class="metric" id="totalSupply">50,000,000,000 VRS</div>
    </div>
  </div>

  <script>
    async function loadStats() {
      try {
        const res = await fetch('/api/chain');
        const data = await res.json();
        document.getElementById('blockHeight').innerText = data.currentHeight !== undefined ? data.currentHeight : 1;
        document.getElementById('validators').innerText = data.validatorCount || 5;
        document.getElementById('totalSupply').innerText = (data.totalSupply || 50000000000).toLocaleString() + ' VRS';
      } catch (e) {
        console.error('Error loading stats:', e);
      }
    }
    loadStats();
    setInterval(loadStats, 3000);
  </script>
</body>
</html>
