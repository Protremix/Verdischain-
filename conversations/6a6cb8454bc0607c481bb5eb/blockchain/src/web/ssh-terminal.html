/* Fluid Typography & Box Sizing */

  --verdis-fluid-h1: clamp(1.75rem, 4.5vw, 3rem);

/* Touch-Friendly Buttons and Navigation Items (min 44px height/width) */

  min-height: 44px;
  min-width: 44px;

}

/* Ensure tables scroll horizontally on mobile without breaking layout */

.table-wrapper, .table-container, .table-responsive, .table-scroll, div:has(> table) {
  width: 100%;
  max-width: 100%;
  overflow-x: auto !important;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 1rem;
}

/* Mobile Table Horizontal Scroll */
@media (max-width: 768px) {
  table {
    display: block;
    overflow-x: auto;
    white-space: nowrap;
    max-width: 100%;
  }

  /* Responsive Grids: Convert to 1 or 2 columns */
  .grid, .grid-2, .grid-3, .grid-4, .cards-grid, .stats-grid, .ecosystem-grid, 
  .templates-grid, .hero-grid, .content-grid, .dashboard-grid, .features-grid,
  .quick-stats, .nodes-grid, .metrics-grid,
  div[class*="grid"], div[style*="display: grid"], div[style*="display:grid"] {
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)) !important;
    gap: 1rem !important;

  /* Flex Layout & Navigation Adaptations */
  header, nav, .navbar, .nav-inner, .header, .top-navbar {
    flex-wrap: wrap !important;
    padding-left: 12px !important;
    padding-right: 12px !important;

  /* Split/Sidebar Layouts to Stacked */

  .sidebar, .aside, .docs-sidebar, .nav-sidebar {

<script id="verdis-cookie-script">
(function() {
  function initCookieConsent() {
    var consentKey = 'verdis_cookie_consent';
    var banner = document.getElementById('verdis-cookie-banner');
    var acceptBtn = document.getElementById('verdis-cookie-accept');
    var declineBtn = document.getElementById('verdis-cookie-decline');

    if (!banner || !acceptBtn || !declineBtn) return;

    var choice = localStorage.getItem(consentKey);
    if (!choice) {
      banner.style.display = 'block';
      setTimeout(function() {
        banner.classList.add('verdis-cookie-show');
      }, 300);
    }

    function handleConsent(value) {
      try {
        localStorage.setItem(consentKey, value);
      } catch(e) {}
      banner.classList.remove('verdis-cookie-show');
      setTimeout(function() {
        banner.style.display = 'none';
      }, 500);
    }

    acceptBtn.addEventListener('click', function() { handleConsent('accepted'); });
    declineBtn.addEventListener('click', function() { handleConsent('declined'); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCookieConsent);
  } else {
    initCookieConsent();
  }
})();
</script>

<!-- Basic Analytics Script -->
<script id="verdis-analytics-script">
(function() {
  try {
    var pageUrl = window.location.href;
    var pathname = window.location.pathname;
    var timestamp = new Date().toISOString();

    // 1. Track page view in localStorage
    var analyticsKey = 'verdis_analytics_views';
    var views = [];
    try {
      var stored = localStorage.getItem(analyticsKey);
      if (stored) {
        views = JSON.parse(stored);
      }
    } catch(e) {}

    views.push({
      url: pageUrl,
      path: pathname,
      timestamp: timestamp
    });

    if (views.length > 50) {
      views = views.slice(views.length - 50);
    }

    try {
      localStorage.setItem(analyticsKey, JSON.stringify(views));
    } catch(e) {}

    // 2. Send beacon to /api/analytics/track
    var payload = JSON.stringify({
      url: pageUrl,
      path: pathname,
      timestamp: timestamp,
      referrer: document.referrer || '',
      userAgent: navigator.userAgent || ''
    });

    if (navigator.sendBeacon) {
      var blob = new Blob([payload], { type: 'application/json' });
      navigator.sendBeacon('/api/analytics/track', blob);
    } else {
      fetch('/api/analytics/track', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload,
        keepalive: true
      }).catch(function() {});
    }
  } catch(e) {
    // Non-blocking, fails silently
  }
})();
</script>
