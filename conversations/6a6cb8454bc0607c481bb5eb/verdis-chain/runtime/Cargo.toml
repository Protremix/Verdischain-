[package]
name = "verdis-runtime"
version = "2.0.0"
description = "Runtime for Verdis Chain — the world's first fully green, carbon-negative blockchain"
license = "MIT"
edition = "2021"
publish = false

[dependencies]
codec = { workspace = true, features = ["derive", "max-encoded-len"] }
scale-info = { workspace = true, features = ["derive"] }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }

# Substrate
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-executive = { workspace = true }
frame-try-runtime = { workspace = true, optional = true }
frame-benchmarking = { workspace = true, optional = true }

sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-io = { workspace = true }
sp-std = { workspace = true }
sp-api = { workspace = true }
sp-block-builder = { workspace = true }
sp-consensus-aura = { workspace = true }
sp-inherents = { workspace = true }
sp-offchain = { workspace = true }
sp-session = { workspace = true }
sp-transaction-pool = { workspace = true }
sp-version = { workspace = true }
sp-timestamp = { workspace = true }

# Pallets
pallet-aura = { workspace = true }
pallet-balances = { workspace = true }
pallet-sudo = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-transaction-payment = { workspace = true }
pallet-session = { workspace = true }

# Verdis custom pallets
pallet-dpos = { path = "../pallets/dpos", default-features = false }
pallet-amm-dex = { path = "../pallets/amm-dex", default-features = false }
pallet-eco = { path = "../pallets/eco", default-features = false }
pallet-tokenomics = { path = "../pallets/tokenomics", default-features = false }
pallet-vesting = { path = "../pallets/vesting", default-features = false }

[build-dependencies]
substrate-wasm-builder = { workspace = true, optional = true }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "serde",
    "serde_json",
    "frame-support/std",
    "frame-system/std",
    "frame-executive/std",
    "frame-try-runtime?/std",
    "sp-core/std",
    "sp-runtime/std",
    "sp-io/std",
    "sp-std/std",
    "sp-api/std",
    "sp-block-builder/std",
    "sp-consensus-aura/std",
    "sp-inherents/std",
    "sp-offchain/std",
    "sp-session/std",
    "sp-transaction-pool/std",
    "sp-version/std",
    "sp-timestamp/std",
    "pallet-aura/std",
    "pallet-balances/std",
    "pallet-sudo/std",
    "pallet-timestamp/std",
    "pallet-transaction-payment/std",
    "pallet-session/std",
    "pallet-dpos/std",
    "pallet-amm-dex/std",
    "pallet-eco/std",
    "pallet-tokenomics/std",
    "pallet-vesting/std",
    "substrate-wasm-builder",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "pallet-balances/runtime-benchmarks",
    "pallet-timestamp/runtime-benchmarks",
    "pallet-dpos/runtime-benchmarks",
    "pallet-amm-dex/runtime-benchmarks",
    "pallet-eco/runtime-benchmarks",
    "pallet-tokenomics/runtime-benchmarks",
    "pallet-vesting/runtime-benchmarks",
]
try-runtime = [
    "frame-try-runtime/try-runtime",
    "frame-system/try-runtime",
    "pallet-balances/try-runtime",
    "pallet-aura/try-runtime",
    "pallet-timestamp/try-runtime",
    "pallet-transaction-payment/try-runtime",
    "pallet-sudo/try-runtime",
    "pallet-session/try-runtime",
    "pallet-dpos/try-runtime",
    "pallet-amm-dex/try-runtime",
    "pallet-eco/try-runtime",
    "pallet-tokenomics/try-runtime",
    "pallet-vesting/try-runtime",
]
