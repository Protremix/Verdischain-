syntax = "proto3";

package verdis.v1;

// Verdis Chain gRPC API
// Provides real-time blockchain data, transaction submission, and wallet operations

service VerdisService {
  // === Blockchain ===
  rpc GetBlock(GetBlockRequest) returns (BlockResponse);
  rpc GetLatestBlock(EmptyRequest) returns (BlockResponse);
  rpc GetBlockRange(BlockRangeRequest) returns (BlockListResponse);
  rpc GetTransaction(GetTransactionRequest) returns (TransactionResponse);
  rpc GetChainInfo(EmptyRequest) returns (ChainInfoResponse);

  // === Validator / DPoS ===
  rpc GetValidators(EmptyRequest) returns (ValidatorListResponse);
  rpc GetActiveValidators(EmptyRequest) returns (ValidatorListResponse);
  rpc GetValidator(GetValidatorRequest) returns (ValidatorResponse);
  rpc GetEpochInfo(EmptyRequest) returns (EpochInfoResponse);

  // === DEX ===
  rpc GetPools(EmptyRequest) returns (PoolListResponse);
  rpc GetPool(GetPoolRequest) returns (PoolResponse);
  rpc GetSwapHistory(SwapHistoryRequest) returns (SwapHistoryResponse);

  // === Eco ===
  rpc GetCarbonCredits(EmptyRequest) returns (CarbonCreditListResponse);
  rpc GetReforestProjects(EmptyRequest) returns (ReforestProjectListResponse);
  rpc GetEcoMetrics(EmptyRequest) returns (EcoMetricsResponse);

  // === Tokenomics ===
  rpc GetTokenomics(EmptyRequest) returns (TokenomicsResponse);
  rpc GetVestingSchedules(EmptyRequest) returns (VestingScheduleListResponse);

  // === Storage ===
  rpc GetStorageRecords(EmptyRequest) returns (StorageRecordListResponse);
  rpc GetStorageProviders(EmptyRequest) returns (StorageProviderListResponse);

  // === Transactions ===
  rpc SubmitTransaction(SubmitTransactionRequest) returns (SubmitTransactionResponse);
  rpc SubscribeBlocks(EmptyRequest) returns (stream BlockNotification);
  rpc SubscribeTransactions(EmptyRequest) returns (stream TransactionNotification);
}

// === Messages ===

message EmptyRequest {}

message GetBlockRequest {
  uint32 block_number = 1;
  string block_hash = 2;
}

message BlockRangeRequest {
  uint32 start = 1;
  uint32 end = 2;
}

message BlockResponse {
  uint32 number = 1;
  string hash = 2;
  string parent_hash = 3;
  uint64 timestamp = 4;
  uint32 transaction_count = 5;
  string state_root = 6;
  string extrinsics_root = 7;
  string author = 8;
}

message BlockListResponse {
  repeated BlockResponse blocks = 1;
}

message GetTransactionRequest {
  string tx_hash = 1;
}

message TransactionResponse {
  string hash = 1;
  uint32 block_number = 2;
  uint64 timestamp = 3;
  string from = 4;
  string to = 5;
  uint64 amount = 6;
  uint64 fee = 7;
  bool success = 8;
  string extrinsic = 9;
}

message ChainInfoResponse {
  string chain_name = 1;
  uint64 chain_id = 2;
  uint32 best_block = 3;
  uint32 finalized_block = 4;
  uint64 total_supply = 5;
  uint64 circulating_supply = 6;
  uint32 active_validators = 7;
  uint32 total_validators = 8;
  uint64 total_staked = 9;
  uint64 block_time_ms = 10;
  string consensus = 11;
}

// === Validator Messages ===

message GetValidatorRequest {
  string address = 1;
}

message ValidatorResponse {
  string address = 1;
  uint64 stake = 2;
  uint64 total_votes = 3;
  uint64 blocks_produced = 4;
  uint64 rewards_earned = 5;
  bool active = 6;
  bool slashed = 7;
  uint32 green_score = 8;
  string energy_source = 9;
}

message ValidatorListResponse {
  repeated ValidatorResponse validators = 1;
}

message EpochInfoResponse {
  uint32 current_epoch = 1;
  uint32 epoch_start_block = 2;
  uint32 epoch_length = 3;
  uint32 blocks_remaining = 4;
}

// === DEX Messages ===

message GetPoolRequest {
  uint32 pool_id = 1;
}

message PoolResponse {
  uint32 pool_id = 1;
  string token_a = 2;
  string token_b = 3;
  uint64 reserve_a = 4;
  uint64 reserve_b = 5;
  uint64 total_lp = 6;
  uint32 fee_numerator = 7;
  uint32 fee_denominator = 8;
  string price = 9;
}

message PoolListResponse {
  repeated PoolResponse pools = 1;
}

message SwapHistoryRequest {
  uint32 pool_id = 1;
  uint32 limit = 2;
}

message SwapRecordResponse {
  uint32 pool_id = 1;
  string token_in = 2;
  string token_out = 3;
  uint64 amount_in = 4;
  uint64 amount_out = 5;
  uint64 fee = 6;
}

message SwapHistoryResponse {
  repeated SwapRecordResponse swaps = 1;
}

// === Eco Messages ===

message CarbonCreditResponse {
  string id = 1;
  string project_name = 2;
  uint64 tons_co2 = 3;
  bool verified = 4;
  bool retired = 5;
  string owner = 6;
}

message CarbonCreditListResponse {
  repeated CarbonCreditResponse credits = 1;
  uint64 total_co2_offset = 2;
}

message ReforestProjectResponse {
  string id = 1;
  string name = 2;
  uint32 trees_planted = 3;
  string location = 4;
  uint32 survival_rate = 5;
  bool verified = 6;
}

message ReforestProjectListResponse {
  repeated ReforestProjectResponse projects = 1;
  uint32 total_trees_planted = 2;
}

message EcoMetricsResponse {
  uint64 total_co2_offset = 1;
  uint32 total_trees_planted = 2;
  uint32 total_credits_retired = 3;
  uint32 active_green_validators = 4;
  uint32 total_reforest_projects = 5;
  uint32 total_carbon_credits = 6;
}

// === Tokenomics Messages ===

message DistributionCategoryResponse {
  string name = 1;
  uint64 amount = 2;
  uint32 percentage = 3;
  uint32 vesting_days = 4;
  uint32 cliff_days = 5;
  uint64 released = 6;
}

message TokenomicsResponse {
  uint64 total_supply = 1;
  uint64 circulating_supply = 2;
  uint64 investor_allocation = 3;
  uint64 presale_raised = 4;
  uint64 presale_sold = 5;
  uint32 presale_price_bps = 6;
  repeated DistributionCategoryResponse distribution = 7;
}

message VestingScheduleResponse {
  string label = 1;
  uint64 total_amount = 2;
  uint32 vesting_days = 3;
  uint32 cliff_days = 4;
}

message VestingScheduleListResponse {
  repeated VestingScheduleResponse schedules = 1;
}

// === Storage Messages ===

message StorageRecordResponse {
  string id = 1;
  string backend = 2;
  string owner = 3;
  uint64 size_bytes = 4;
  string blake3_hash = 5;
  bool pinned = 6;
  uint64 created_at = 7;
}

message StorageRecordListResponse {
  repeated StorageRecordResponse records = 1;
  uint64 total_stored = 2;
}

message StorageProviderResponse {
  string address = 1;
  string backend = 2;
  string endpoint = 3;
  uint32 reputation = 4;
  uint64 total_stored = 5;
  bool active = 6;
}

message StorageProviderListResponse {
  repeated StorageProviderResponse providers = 1;
}

// === Transaction Submission ===

message SubmitTransactionRequest {
  bytes extrinsic = 1;
}

message SubmitTransactionResponse {
  string tx_hash = 1;
  bool accepted = 2;
}

// === Streaming Notifications ===

message BlockNotification {
  uint32 block_number = 1;
  string block_hash = 2;
  uint64 timestamp = 3;
  string author = 4;
  uint32 transaction_count = 5;
}

message TransactionNotification {
  string hash = 1;
  uint32 block_number = 2;
  string from = 3;
  string to = 4;
  uint64 amount = 5;
  bool success = 6;
}
