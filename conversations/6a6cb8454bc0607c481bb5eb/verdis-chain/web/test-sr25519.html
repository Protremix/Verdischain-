<!DOCTYPE html>
<html>
<head><title>SR25519 Test</title></head>
<body>
<script type="module">
import { Keyring } from "https://esm.sh/@polkadot/keyring@12.6.2";
import { cryptoWaitReady, mnemonicGenerate } from "https://esm.sh/@polkadot/util-crypto@12.6.2";

const mn = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about";
await cryptoWaitReady();
const keyring = new Keyring({ type: "sr25519", ss58Format: 909 });
const kp = keyring.addFromMnemonic(mn);
document.body.innerHTML = "Address: " + kp.address + "<br>Pubkey: " + Array.from(kp.publicKey).map(b => b.toString(16).padStart(2,"0")).join("");
</script>
</body>
</html>
