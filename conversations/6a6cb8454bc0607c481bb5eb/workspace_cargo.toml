[workspace]
resolver = "2"
members = [
    "pallets/dpos",
    "pallets/amm-dex",
    "pallets/eco",
    "pallets/tokenomics",
    "pallets/vesting",
    "pallets/evm",
    "pallets/storage",
    "runtime",
    "node",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Protremix"]
license = "MIT"
repository = "https://github.com/verdischain/verdis-chain"

[workspace.dependencies]
# Core codec/serialization
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.140", default-features = false }

# FRAME (runtime framework)
frame-support = { version = "48.0.0", default-features = false }
frame-system = { version = "48.0.0", default-features = false }
frame-executive = { version = "48.0.0", default-features = false }
frame-benchmarking = { version = "49.0.0", default-features = false }
frame-try-runtime = { version = "0.54.0", default-features = false, optional = true }

# Substrate primitives (sp-* crates)
sp-core = { version = "43.0.0", default-features = false }
sp-io = { version = "48.0.0", default-features = false }
sp-runtime = { version = "48.0.0", default-features = false }
sp-std = { version = "14.0.0", default-features = false }
sp-arithmetic = { version = "28.0.1", default-features = false }
sp-api = { version = "43.0.0", default-features = false }
sp-block-builder = { version = "43.0.0", default-features = false }
sp-blockchain = { version = "46.0.0" }
sp-consensus = { version = "0.49.0" }
sp-consensus-babe = { version = "0.49.0", default-features = false }
sp-consensus-grandpa = { version = "30.0.0", default-features = false }
sp-database = { version = "10.0.1" }
sp-inherents = { version = "43.0.0", default-features = false }
sp-keyring = { version = "48.0.0" }
sp-keystore = { version = "0.49.0", default-features = false }
sp-offchain = { version = "43.0.0", default-features = false }
sp-session = { version = "45.0.0", default-features = false }
sp-timestamp = { version = "43.0.0", default-features = false }
sp-transaction-pool = { version = "43.0.0", default-features = false }
sp-version = { version = "46.0.0", default-features = false }
sp-application-crypto = { version = "48.0.0", default-features = false }

# Core pallets
pallet-balances = { version = "50.0.0", default-features = false }
pallet-session = { version = "49.0.0", default-features = false }
pallet-babe = { version = "49.0.0", default-features = false }
pallet-grandpa = { version = "49.0.0", default-features = false }
pallet-sudo = { version = "49.0.0", default-features = false }
pallet-timestamp = { version = "48.0.0", default-features = false }
pallet-transaction-payment = { version = "49.0.0", default-features = false }
pallet-scheduler = { version = "50.0.0", default-features = false }
pallet-preimage = { version = "49.0.0", default-features = false }
pallet-contracts = { version = "49.0.0", default-features = false }

# RPC runtime APIs
frame-system-rpc-runtime-api = { version = "48.0.0", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { version = "49.0.0", default-features = false }

# Substrate client (sc-* crates) — for the node
sc-cli = { version = "0.61.0" }
sc-client-api = { version = "47.0.0" }
sc-client-db = { version = "0.54.0" }
sc-consensus = { version = "0.57.0" }
sc-consensus-babe = { version = "0.58.0" }
sc-consensus-babe-rpc = { version = "0.48.0" }
sc-consensus-grandpa = { version = "0.43.0" }
sc-consensus-grandpa-rpc = { version = "0.43.0" }
sc-executor = { version = "0.50.0" }
sc-keystore = { version = "42.0.0" }
sc-network = { version = "0.58.0" }
sc-network-common = { version = "0.55.0" }
sc-network-sync = { version = "0.57.0" }
sc-offchain = { version = "53.0.0" }
sc-rpc = { version = "54.0.0" }
sc-rpc-api = { version = "0.58.0" }
sc-rpc-server = { version = "31.0.0" }
sc-service = { version = "0.60.0" }
sc-storage-monitor = { version = "0.31.0" }
sc-sysinfo = { version = "50.0.0" }
sc-telemetry = { version = "33.0.0" }
sc-transaction-pool = { version = "47.0.0" }
sc-transaction-pool-api = { version = "46.0.0" }
sc-utils = { version = "23.0.0" }
sc-block-builder = { version = "0.51.0" }
sc-chain-spec = { version = "51.0.0" }
sc-basic-authorship = { version = "0.56.0" }

# RPC helpers
substrate-frame-rpc-system = { version = "53.0.0" }
pallet-transaction-payment-rpc = { version = "52.0.0" }
substrate-prometheus-endpoint = { version = "0.17.7" }

# Build tools
substrate-wasm-builder = { version = "34.0.0" }
substrate-build-script-utils = { version = "0.17.0" }

# JSON-RPC
jsonrpsee = { version = "0.24.3" }

[profile.release]
opt-level = 3
panic = "unwind"
lto = true
codegen-units = 1

[profile.test]
opt-level = 0
debug = true
