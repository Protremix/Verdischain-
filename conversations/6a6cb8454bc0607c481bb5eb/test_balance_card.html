<!DOCTYPE html>
<html><head><style>
:root{--hero-bg:#1a1a1a;--accent:#16a34a;--accent-2:#84fe87;--accent-3:#00a86b;--accent-glow:rgba(22,163,74,0.35);--text-muted:#334155;--text-dark:#0f172a;--radius-lg:16px}
body{font-family:sans-serif;background:#f1f5f9;padding:40px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.balance-card{background:#fff;border:1px solid #e2e8f0;border-radius:var(--radius-lg);padding:24px;position:relative;overflow:hidden}
.balance-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.balance-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:8px}
.balance-value{font-size: 18px;font-weight:800;color:var(--text-dark);font-family:monospace}
.balance-value .unit{font-size:14px;color:var(--text-muted);font-weight:500;margin-left:4px}
.balance-sub{font-size:12px;color:var(--text-muted);margin-top:8px}
.address-card{background:#fff;border:1px solid #e2e8f0;border-radius:var(--radius-lg);padding:24px}

.dash-grid .balance-card, .dash-grid .address-card { opacity: 0; animation: dashCardIn 500ms cubic-bezier(0.16,1,0.3,1) forwards; }
.dash-grid .balance-card { animation-delay: 100ms; }
.dash-grid .address-card { animation-delay: 200ms; }
@keyframes dashCardIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

.balance-card { position: relative; }
.balance-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border-radius: var(--radius-lg);
  padding: 1px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
  background-size: 300% 300%;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0;
  transition: opacity 400ms;
  animation: gradientShift 4s ease-in-out infinite;
  pointer-events: none;
}
.balance-card:hover::after { opacity: 0.6; }
@keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

.balance-value {
  background: linear-gradient(135deg, var(--text-dark) 0%, var(--accent-3) 50%, var(--text-dark) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: textShine 5s ease-in-out infinite;
}
@keyframes textShine { 0%, 100% { background-position: 0% center; } 50% { background-position: 100% center; } }
.balance-value .unit { -webkit-text-fill-color: var(--text-muted); }
</style></head>
<body>
<div class="dash-grid">
<div class="balance-card">
<div class="balance-label">Total Balance</div>
<div class="balance-value" id="balanceDisplay">0.0000<span class="unit">VRDX</span></div>
<div class="balance-sub">Loading balance from chain...</div>
</div>
<div class="address-card">
<div>Your Address</div>
<div>kibKmJuKipPp71a51bDYpwUhChYgF5Kzmtm8Q67b45EWW77gD</div>
</div>
</div>
</body></html>
