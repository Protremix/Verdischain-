name: verdis_wallet
description: "A complete mobile wallet for the Verdis blockchain."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  local_auth: ^2.1.6
  provider: ^6.1.1
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  http: ^1.2.0
  crypto: ^3.0.3
  path: ^1.8.3
  shared_preferences: ^2.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/verdis-logo-white.png
    - assets/images/verdis-logo-full.png
