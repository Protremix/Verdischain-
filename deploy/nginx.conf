# Verdis Chain — nginx.conf
# Production configuration for verdischain.com (91.98.160.145)
# Serves all 8 web pages from /opt/verdis-repo/dist/web/

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml application/atom+xml image/svg+xml;

    # Cache static assets
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=verdis_cache:10m
                     max_size=500m inactive=60m use_temp_path=off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=verdis_limit:10m rate=10r/s;

    # Upstream for WebSocket proxy (Substrate node)
    upstream substrate_node {
        server 127.0.0.1:9944;
        keepalive 32;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name verdischain.com www.verdischain.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name verdischain.com www.verdischain.com;

        # SSL certificates (managed by certbot/Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/verdischain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/verdischain.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Root directory
        root /opt/verdis-repo/dist/web;
        index index.html;

        # Rate limiting
        limit_req zone=verdis_limit burst=20 nodelay;

        # Main pages — clean URLs without .html extension
        location / {
            try_files $uri $uri/ $uri.html /index.html;
        }

        location = /explorer { try_files /explorer.html =404; }
        location = /docs { try_files /docs.html =404; }
        location = /whitepaper { try_files /whitepaper.html =404; }
        location = /dex { try_files /dex.html =404; }
        location = /eco { try_files /eco.html =404; }
        location = /validators { try_files /validators.html =404; }
        location = /wallet { try_files /wallet.html =404; }

        # Substrate WebSocket proxy
        location /substrate-ws {
            proxy_pass http://substrate_node/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # API proxy (if backend API is running)
        location /api/ {
            proxy_pass http://127.0.0.1:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Static asset caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # HTML files — short cache (content changes frequently)
        location ~* \.html$ {
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
