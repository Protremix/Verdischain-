version: '3.8'

services:
  verdis-node:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: verdis:v2.0.0
    container_name: verdis-node
    restart: unless-stopped
    user: "10001:10001"
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    ulimits:
      nofile:
        soft: 10000
        hard: 10000
    ports:
      # P2P network port exposed publicly
      - "30333:30333"
      # RPC endpoint restricted to localhost on host interface for security
      - "127.0.0.1:9944:9944"
    volumes:
      - verdis-data:/opt/verdis-chain-rust/data
    command:
      - "verdis"
      - "--chain"
      - "dev"
      - "--base-path"
      - "/opt/verdis-chain-rust/data"
      - "--rpc-port"
      - "9944"
      - "--port"
      - "30333"
      - "--rpc-methods"
      - "Safe"
      - "--validator"
      - "--alice"
      - "--rpc-cors"
      - "all"
      - "--unsafe-rpc-external"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H 'Content-Type: application/json' -d '{\"id\":1, \"jsonrpc\":\"2.0\", \"method\":\"system_health\", \"params\":[]}' http://127.0.0.1:9944 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  verdis-data:
    driver: local
