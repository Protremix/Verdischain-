name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_MAX_RETRIES: 10
  CARGO_INCREMENTAL: 0

jobs:
  fmt-check:
    name: Code Formatting Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (1.78)
        uses: dtolnay/rust-toolchain@1.78
        with:
          components: rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Linter Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libssl-dev protobuf-compiler cmake

      - name: Install Rust Toolchain (1.78 + WASM target)
        uses: dtolnay/rust-toolchain@1.78
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Unit & Integration Tests (60+ tests)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libssl-dev protobuf-compiler cmake

      - name: Install Rust Toolchain (1.78 + WASM target)
        uses: dtolnay/rust-toolchain@1.78
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Tests
        run: cargo test --all --release -- --nocapture

  build:
    name: Build Release Binary & WASM Runtime
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libssl-dev protobuf-compiler cmake

      - name: Install Rust Toolchain (1.78 + WASM target)
        uses: dtolnay/rust-toolchain@1.78
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Workspace
        run: cargo build --release --workspace

      - name: Verify Binary Output
        run: |
          test -f target/release/verdis || (echo "Binary target/release/verdis not found!" && exit 1)

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: verdis-node-linux-amd64
          path: target/release/verdis
          retention-days: 7

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-22.04
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ci-cd/Dockerfile
          push: false
          tags: verdis-chain:latest
          outputs: type=docker,dest=verdis-chain-latest.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: verdis-chain-docker
          path: verdis-chain-latest.tar
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: Run Security Audit
        run: cargo audit || echo "Security audit finished with warnings"
