      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================================================================
  # PUBLIC RPC NODES (2 Nodes: 2GB RAM, 1 CPU each)
  # Expose RPC 9944 (and WS 9933) to host
  # =========================================================================
  verdis-rpc-1:
    <<: *node-common
    container_name: verdis-rpc-1
    hostname: verdis-rpc-1
    depends_on:
      verdis-boot-1:
        condition: service_healthy
    ports:
      - "9944:9944"
      - "9933:9933"
    networks:
      verdis-net:
        ipv4_address: 172.28.0.31
    volumes:
      - verdis-rpc-1-data:/data
      - ./chain-spec.json:/etc/verdis/chain-spec.json:ro
      - ./keys:/etc/verdis/keys:ro
    command:
      - --base-path=/data
      - --chain=/etc/verdis/chain-spec.json
      - --name=verdis-rpc-1
      - --node-key-file=/etc/verdis/keys/rpc-1.node.key
      - --bootnodes=/dns/verdis-boot-1/tcp/30333/p2p/12D3KooWBoot111111111111111111111111111111111111111 /dns/verdis-boot-2/tcp/30333/p2p/12D3KooWBoot222222222222222222222222222222222222222
      - --port=30333
      - --rpc-external
      - --rpc-cors=all
      - --rpc-methods=Safe
      - --rpc-max-connections=5000
      - --ws-external
      - --ws-max-connections=5000
      - --prometheus-external
      - --prometheus-port=9615
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -H 'Content-Type: application/json' -d '{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"system_health\",\"params\":[]}' http://localhost:9944 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  verdis-rpc-2:
    <<: *node-common
    container_name: verdis-rpc-2
    hostname: verdis-rpc-2
    depends_on:
      verdis-boot-1:
        condition: service_healthy
    ports:
      - "9945:9944"
      - "9934:9933"
