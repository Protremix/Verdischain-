      retries: 5
      start_period: 30s

  verdis-validator-4:
    <<: *node-common
    container_name: verdis-validator-4
    hostname: verdis-validator-4
    depends_on:
      verdis-boot-1:
        condition: service_healthy
    networks:
      verdis-net:
        ipv4_address: 172.28.0.24
    volumes:
      - verdis-val-4-data:/data
      - ./chain-spec.json:/etc/verdis/chain-spec.json:ro
      - ./keys:/etc/verdis/keys:ro
    command:
      - --base-path=/data
      - --chain=/etc/verdis/chain-spec.json
      - --name=verdis-validator-4
      - --validator
      - --node-key-file=/etc/verdis/keys/validator-4.node.key
      - --bootnodes=/dns/verdis-boot-1/tcp/30333/p2p/12D3KooWBoot111111111111111111111111111111111111111 /dns/verdis-boot-2/tcp/30333/p2p/12D3KooWBoot222222222222222222222222222222222222222
      - --port=30333
      - --rpc-port=9944
      - --ws-port=9933
      - --rpc-methods=Unsafe
      - --prometheus-external
      - --prometheus-port=9615
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -H 'Content-Type: application/json' -d '{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"system_health\",\"params\":[]}' http://localhost:9944 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  verdis-validator-5:
    <<: *node-common
    container_name: verdis-validator-5
    hostname: verdis-validator-5
    depends_on:
      verdis-boot-1:
        condition: service_healthy
    networks:
      verdis-net:
        ipv4_address: 172.28.0.25
    volumes:
      - verdis-val-5-data:/data
