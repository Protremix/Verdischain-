version: '3.8'

networks:
  verdis-net:
    name: verdis-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  verdis-boot-1-data:
    name: verdis-boot-1-data
  verdis-boot-2-data:
    name: verdis-boot-2-data
  verdis-val-1-data:
    name: verdis-val-1-data
  verdis-val-2-data:
    name: verdis-val-2-data
  verdis-val-3-data:
    name: verdis-val-3-data
  verdis-val-4-data:
    name: verdis-val-4-data
  verdis-val-5-data:
    name: verdis-val-5-data
  verdis-rpc-1-data:
    name: verdis-rpc-1-data
  verdis-rpc-2-data:
    name: verdis-rpc-2-data

x-node-common: &node-common
  image: verdis-chain:latest
  restart: unless-stopped
  networks:
    verdis-net:

services:
  # =========================================================================
  # BOOTNODES
  # =========================================================================
  verdis-boot-1:
    <<: *node-common
    container_name: verdis-boot-1
    hostname: verdis-boot-1
    ports:
      - "30333:30333"
    networks:
      verdis-net:
        ipv4_address: 172.28.0.10
    volumes:
      - verdis-boot-1-data:/data
      - ./chain-spec.json:/etc/verdis/chain-spec.json:ro
      - ./keys:/etc/verdis/keys:ro
    command:
      - --base-path=/data
      - --chain=/etc/verdis/chain-spec.json
      - --name=verdis-boot-1
      - --port=30333
      - --rpc-port=9944
      - --ws-port=9933
      - --node-key-file=/etc/verdis/keys/boot-1.node.key
      - --listen-addr=/ip4/0.0.0.0/tcp/30333
      - --public-addr=/dns/verdis-boot-1/tcp/30333
      - --rpc-methods=Unsafe
      - --prometheus-external
      - --prometheus-port=9615
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -H 'Content-Type: application/json' -d '{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"system_health\",\"params\":[]}' http://localhost:9944 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  verdis-boot-2:
    <<: *node-common
    container_name: verdis-boot-2
    hostname: verdis-boot-2
    ports:
      - "30334:30333"
    networks:
      verdis-net:
        ipv4_address: 172.28.0.11
    volumes:
      - verdis-boot-2-data:/data
      - ./chain-spec.json:/etc/verdis/chain-spec.json:ro
      - ./keys:/etc/verdis/keys:ro
    command:
      - --base-path=/data
      - --chain=/etc/verdis/chain-spec.json
      - --name=verdis-boot-2
      - --port=30333
      - --rpc-port=9944
      - --ws-port=9933
      - --node-key-file=/etc/verdis/keys/boot-2.node.key
      - --bootnodes=/dns/verdis-boot-1/tcp/30333/p2p/12D3KooWBoot111111111111111111111111111111111111111
      - --listen-addr=/ip4/0.0.0.0/tcp/30333
      - --public-addr=/dns/verdis-boot-2/tcp/30333
      - --rpc-methods=Unsafe
      - --prometheus-external
      - --prometheus-port=9615
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -H 'Content-Type: application/json' -d '{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"system_health\",\"params\":[]}' http://localhost:9944 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =========================================================================
  # VALIDATOR NODES (5 Nodes: 4GB RAM, 2 CPUs each)
  # =========================================================================
  verdis-validator-1:
    <<: *node-common
    container_name: verdis-validator-1
    hostname: verdis-validator-1
    depends_on:
      verdis-boot-1:
        condition: service_healthy
    networks:
      verdis-net:
        ipv4_address: 172.28.0.21
    volumes:
      - verdis-val-1-data:/data
      - ./chain-spec.json:/etc/verdis/chain-spec.json:ro
      - ./keys:/etc/verdis/keys:ro
    command:
      - --base-path=/data
      - --chain=/etc/verdis/chain-spec.json
      - --name=verdis-validator-1
      - --validator
      - --node-key-file=/etc/verdis/keys/validator-1.node.key
      - --bootnodes=/dns/verdis-boot-1/tcp/30333/p2p/12D3KooWBoot111111111111111111111111111111111111111 /dns/verdis-boot-2/tcp/30333/p2p/12D3KooWBoot222222222222222222222222222222222222222
      - --port=30333
      - --rpc-port=9944
      - --ws-port=9933
      - --rpc-methods=Unsafe
      - --prometheus-external
      - --prometheus-port=9615
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -H 'Content-Type: application/json' -d '{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"system_health\",\"params\":[]}' http://localhost:9944 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  verdis-validator-2:
    <<: *node-common
    container_name: verdis-validator-2
    hostname: verdis-validator-2
    depends_on:
      verdis-boot-1:
        condition: service_healthy
    networks:
      verdis-net:
        ipv4_address: 172.28.0.22
    volumes:
      - verdis-val-2-data:/data
      - ./chain-spec.json:/etc/verdis/chain-spec.json:ro
      - ./keys:/etc/verdis/keys:ro
    command:
      - --base-path=/data
      - --chain=/etc/verdis/chain-spec.json
      - --name=verdis-validator-2
      - --validator
      - --node-key-file=/etc/verdis/keys/validator-2.node.key
      - --bootnodes=/dns/verdis-boot-1/tcp/30333/p2p/12D3KooWBoot111111111111111111111111111111111111111 /dns/verdis-boot-2/tcp/30333/p2p/12D3KooWBoot222222222222222222222222222222222222222
      - --port=30333
      - --rpc-port=9944
      - --ws-port=9933
      - --rpc-methods=Unsafe
      - --prometheus-external
      - --prometheus-port=9615
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -H 'Content-Type: application/json' -d '{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"system_health\",\"params\":[]}' http://localhost:9944 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  verdis-validator-3:
    <<: *node-common
    container_name: verdis-validator-3
    hostname: verdis-validator-3
    depends_on:
      verdis-boot-1:
        condition: service_healthy
    networks:
      verdis-net:
        ipv4_address: 172.28.0.23
    volumes:
      - verdis-val-3-data:/data
