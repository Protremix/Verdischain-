allprojects {
    repositories {
        mavenCentral()
        maven { url 'http://localhost:8888/google/dl/android/maven2'; allowInsecureProtocol = true }
        maven { url 'http://localhost:8888/maven-central'; allowInsecureProtocol = true }
        maven { url 'http://localhost:8888/gradle'; allowInsecureProtocol = true }
        maven { url 'http://localhost:8888/flutter-io'; allowInsecureProtocol = true }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
