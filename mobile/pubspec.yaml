name: verdis_wallet
description: 'A complete mobile wallet for the Verdis blockchain.'
publish_to: 'none'
version: 1.4.3+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^0.13.6
  crypto: ^3.0.3
  cryptography: ^2.7.0
  path: ^1.8.3
  intl: ^0.19.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/verdis-logo-white.png
    - assets/images/verdis-logo-full.png
    - assets/images/verdis-logo-nav-white.png
    - assets/images/verdis-logo-icon.png
    - assets/verdis_signer.html
    - assets/polkadot-crypto-bundle.js
