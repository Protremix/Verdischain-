// Error logging for Flutter
window.onerror = function(msg, url, line, col, err) {
  console.log("[SignerError] " + msg + " at " + line + ":" + col);
};
</script>

<!-- Polkadot Sr25519 crypto bundle (WASM-powered, works offline) -->
<script src="polkadot-crypto-bundle.js"></script>

// ============================================================
// Verdis Crypto Signer — Sr25519 + BIP39 + SS58 (prefix 909)
// ============================================================

window._polkadotReady = false;

// Initialize WASM on page load

  PolkadotCrypto.cryptoWaitReady().then(function() {
    window._polkadotReady = true;
    console.log("[VerdisCrypto] Polkadot WASM initialized — Sr25519 ready");
  }).catch(function(e) {
    console.log("[VerdisCrypto] WASM init failed: " + e);
  });

// Build word index
var wordIndex = {};
for (var i = 0; i < BIP39_WORDLIST.length; i++) wordIndex[BIP39_WORDLIST[i]] = i;

// ============================================================
// BIP39 MNEMONIC GENERATION (uses crypto.getRandomValues)
// ============================================================
function generateMnemonic() {
  var entropy = new Uint8Array(16); // 128 bits → 12 words
  crypto.getRandomValues(entropy);
  
  // Checksum: first 4 bits of SHA-256(entropy)
  var hash = PolkadotCrypto ? null : null; // We use PolkadotCrypto.encodeAddress for SS58, but for SHA-256 we need our own
  
  // Use SubtleCrypto SHA-256 (available in WebView)
  // Actually, we can use the Polkadot bundle which includes sha256
  // Or just compute it synchronously with a simple SHA-256
  
  // For simplicity, use the PolkadotCrypto mnemonicGenerate (uses BIP39 standard)
  if (window.PolkadotCrypto && window.PolkadotCrypto.mnemonicGenerate) {
    return PolkadotCrypto.mnemonicGenerate();
  }
  
  // Fallback: manual BIP39 generation
  return generateMnemonicFallback(entropy);
}

function generateMnemonicFallback(entropy) {
  // SHA-256 using SubtleCrypto is async, so we use a sync implementation
  // This should rarely be needed since PolkadotCrypto is always available
  throw new Error("PolkadotCrypto not available for mnemonic generation");
}

// ============================================================
// BIP39 MNEMONIC VALIDATION
// ============================================================
function validateMnemonic(mnemonic) {
  if (window.PolkadotCrypto && window.PolkadotCrypto.mnemonicValidate) {
    try {
      return PolkadotCrypto.mnemonicValidate(mnemonic);
    } catch(e) {
      return false;
    }
  }
  // Fallback: basic word count check
  var words = mnemonic.trim().toLowerCase().split(/\s+/);
  return words.length === 12 && words.every(function(w) { return wordIndex[w] !== undefined; });
}

// ============================================================
// SS58 ADDRESS ENCODING (prefix 909)
// ============================================================
function ss58Encode(publicKey) {
  if (window.PolkadotCrypto) {
    return PolkadotCrypto.encodeAddress(publicKey, 909);
  }
  throw new Error("PolkadotCrypto not available for SS58 encoding");
}

// ============================================================
// KEY DERIVATION (Sr25519 via Polkadot WASM)
// ============================================================
function deriveKeypair(mnemonic) {
  if (!window._polkadotReady) throw new Error("WASM not ready");
  if (!window.PolkadotCrypto) throw new Error("PolkadotCrypto not loaded");
  
  var keyring = new PolkadotCrypto.Keyring({ type: "sr25519", ss58Format: 909 });
  var kp = keyring.addFromMnemonic(mnemonic);
  return kp;
}

// ============================================================
// WALLET STORAGE
// ============================================================
var STORAGE_KEY = "verdis_wallet_account";

function uint8ToHex(arr) {
  return Array.from(arr).map(function(b) {
    return (b < 16 ? "0" : "") + b.toString(16);
  }).join("");
}

function hexToUint8(hex) {
  return new Uint8Array(hex.match(/.{2}/g).map(function(b) { return parseInt(b, 16); }));
}

// PIN-based encryption using Web Crypto API
async function derivePinKey(pin) {
  var enc = new TextEncoder();
  var keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(pin), { name: "PBKDF2" }, false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: enc.encode("verdis-wallet-salt"), iterations: 100000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

async function encryptData(data, pin) {
  var key = await derivePinKey(pin);
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var enc = new TextEncoder();
  var ciphertext = await crypto.subtle.encrypt(
    { name: "AES-GCM", iv: iv },
    key,
    enc.encode(JSON.stringify(data))
  );
  var combined = new Uint8Array(iv.length + ciphertext.byteLength);
  combined.set(iv, 0);
  combined.set(new Uint8Array(ciphertext), iv.length);
  return btoa(String.fromCharCode.apply(null, combined));
}

async function decryptData(b64, pin) {
  var key = await derivePinKey(pin);
  var combined = Uint8Array.from(atob(b64), function(c) { return c.charCodeAt(0); });
  var iv = combined.slice(0, 12);
  var ciphertext = combined.slice(12);
  var decrypted = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: iv },
    key,
    ciphertext
  );
  return JSON.parse(new TextDecoder().decode(decrypted));
}

async function createWallet(pin) {
  var mnemonic = generateMnemonic();
  var kp = deriveKeypair(mnemonic);
  var address = kp.address;
  var publicKeyHex = uint8ToHex(kp.publicKey);
  
  var encryptedSecret = await encryptData({ mnemonic: mnemonic }, pin);
  var account = { address: address, publicKey: publicKeyHex, enc: encryptedSecret };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(account));
  
  return { mnemonic: mnemonic, address: address, publicKey: publicKeyHex };
}

async function importWallet(mnemonic, pin) {
  var trimmed = mnemonic.trim().toLowerCase();
  if (!validateMnemonic(trimmed)) {
    throw new Error("Invalid BIP39 mnemonic phrase. Check your 12 words.");
  }
  var kp = deriveKeypair(trimmed);
  var address = kp.address;
  var publicKeyHex = uint8ToHex(kp.publicKey);
  
  var encryptedSecret = await encryptData({ mnemonic: trimmed }, pin);
  var account = { address: address, publicKey: publicKeyHex, enc: encryptedSecret };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(account));
  
  return { address: address, publicKey: publicKeyHex };
}

function loadWallet() {
  var raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return null;
  return JSON.parse(raw);
}

function hasWallet() {
  return localStorage.getItem(STORAGE_KEY) !== null;
}

function getAddress() {
  var w = loadWallet();
  return w ? w.address : null;
}

function clearWallet() {
  localStorage.removeItem(STORAGE_KEY);
}

async function exportMnemonic(pin) {
  var w = loadWallet();
  if (!w) throw new Error("No wallet found");
  var data = await decryptData(w.enc, pin);
  return data.mnemonic;
}

// Sign a message using Sr25519
async function signMessage(messageHex, mnemonic) {
  if (!window._polkadotReady) throw new Error("WASM not ready");
  var keyring = new PolkadotCrypto.Keyring({ type: "sr25519", ss58Format: 909 });
  var kp = keyring.addFromMnemonic(mnemonic);
  var msgBytes = hexToUint8(messageHex);
  var sig = kp.sign(msgBytes);
  return uint8ToHex(sig);
}

// ============================================================
// EXPORT
// ============================================================
window.VerdisCrypto = {
  generateMnemonic: generateMnemonic,
  validateMnemonic: validateMnemonic,
  deriveKeypair: deriveKeypair,
  ss58Encode: ss58Encode,
  createWallet: createWallet,
  importWallet: importWallet,
  loadWallet: loadWallet,
  hasWallet: hasWallet,
  getAddress: getAddress,
  clearWallet: clearWallet,
  exportMnemonic: exportMnemonic,
  signMessage: signMessage
};

console.log("[VerdisCrypto] Module loaded — Sr25519 + BIP39 + SS58 (via Polkadot WASM)");
</script>

// ============================================================

// SS58 decode: convert SS58 address to 32-byte public key
function ss58Decode(address) {
  // SS58 format: prefix + 32-byte public key + 2-byte checksum
  // Base58 decode
  var ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  var decoded = [];
  for (var i = 0; i < address.length; i++) {
    var c = ALPHABET.indexOf(address[i]);
    if (c < 0) throw new Error('Invalid SS58 character: ' + address[i]);
    for (var j = 0; j < decoded.length; j++) {
      c += decoded[j] * 58;
      decoded[j] = c & 0xff;
      c >>= 8;
    }
    while (c > 0) {
      decoded.push(c & 0xff);
      c >>= 8;
    }
  }
  // decoded is little-endian, reverse to big-endian
  decoded.reverse();
  
  // Check we have enough bytes: 1 prefix + 32 pubkey + 2 checksum = 35
  if (decoded.length < 35) throw new Error('SS58 address too short: ' + decoded.length);
  
  // Extract public key (skip first byte which is the SS58 prefix)
  var pubkey = decoded.slice(1, 33);
  return new Uint8Array(pubkey);
}

// SCALE compact encoding
function compactEncode(n) {
  if (n < 0) throw new Error('Negative not supported');
  if (n < 64) {
    return new Uint8Array([n << 2]);
  } else if (n < 16384) {
    return new Uint8Array([(n << 2) | 0x01 & 0xff, (n << 2) >> 8 & 0xff]);
  } else if (n < 1073741824) {
    var b = new Uint8Array(4);
    b[0] = ((n << 2) | 0x02) & 0xff;
    b[1] = ((n << 2) >> 8) & 0xff;
    b[2] = ((n << 2) >> 16) & 0xff;
    b[3] = ((n << 2) >> 24) & 0xff;
    return b;
  } else {
    // Big integer mode
    var hex = n.toString(16);
    if (hex.length % 2) hex = '0' + hex;
    var bytes = [];
    for (var i = 0; i < hex.length; i += 2) {
      bytes.push(parseInt(hex.substr(i, 2), 16));
    }
    // Reverse for little-endian
    bytes.reverse();
    var prefix = ((bytes.length - 4) << 2) | 0x03;
    return new Uint8Array([prefix].concat(bytes));
  }
}

// Encode u128 as SCALE bytes (little-endian, 16 bytes)
function encodeU128(n) {
  var bytes = new Uint8Array(16);
  var val = n;
  for (var i = 0; i < 16; i++) {
    bytes[i] = val & 0xff;
    val = Math.floor(val / 256);
  }
  return bytes;
}

// Concatenate Uint8Arrays
function concatBytes() {
  var total = 0;
  for (var i = 0; i < arguments.length; i++) {
    total += arguments[i].length;
  }
  var result = new Uint8Array(total);
  var offset = 0;
  for (var i = 0; i < arguments.length; i++) {
    result.set(arguments[i], offset);
    offset += arguments[i].length;
  }
  return result;
}

// Convert Uint8Array to hex string
function bytesToHex(bytes) {
  return Array.from(bytes).map(function(b) {
    return (b < 16 ? '0' : '') + b.toString(16);
  }).join('');
}

// Create Balances.transfer call (pallet=4, function=0)
// transfer(dest: MultiAddress<AccountId32>, value: u128)
function createTransferCall(destAddress, amountAtoms) {
  var destPubkey = ss58Decode(destAddress);
  // Call index: [4, 0] for Balances.transfer
  var callIndex = new Uint8Array([4, 0]);
  // MultiAddress::Address32 = variant 0, then 32 bytes
  var multiAddressTag = new Uint8Array([0x00]);
  // Amount as compact-encoded u128
  var amount = compactEncode(amountAtoms);
  
  return concatBytes(callIndex, multiAddressTag, destPubkey, amount);
}

// Sign a Balances.transfer extrinsic locally
// Returns signed extrinsic hex string
async function signTransferExtrinsic(mnemonic, destAddress, amountAtoms, nonce, genesisHashHex, blockHashHex, specVersion) {
  if (!window._polkadotReady) throw new Error('WASM not ready');
  
  // 1. Create the call bytes
  var callBytes = createTransferCall(destAddress, amountAtoms);
  
  // 2. Create signing payload
  // Era: immortal (0x00)
  var era = new Uint8Array([0x00]);
  // Nonce: compact-encoded
  var nonceEncoded = compactEncode(nonce);
  // Tip: 0 (compact-encoded)
  var tip = new Uint8Array([0x00]);
  // Spec version: u32 LE (4 bytes)
  var specVerBytes = new Uint8Array(4);
  specVerBytes[0] = specVersion & 0xff;
  specVerBytes[1] = (specVersion >> 8) & 0xff;
  specVerBytes[2] = (specVersion >> 16) & 0xff;
  specVerBytes[3] = (specVersion >> 24) & 0xff;
  
  // Genesis hash: 32 bytes from hex
  var genesisHash = hexToUint8(genesisHashHex);
  // Block hash: 32 bytes from hex (same as genesis for immortal era)
  var blockHash = hexToUint8(blockHashHex);
  
  var signingPayload = concatBytes(callBytes, era, nonceEncoded, tip, specVerBytes, genesisHash, blockHash);
  
  // 3. Sign with sr25519
  var keyring = new PolkadotCrypto.Keyring({ type: 'sr25519', ss58Format: 909 });
  var kp = keyring.addFromMnemonic(mnemonic);
  var signature = kp.sign(signingPayload);
  
  // 4. Create the signed extrinsic
  // Format: [version=0x84] [signature=64 bytes] [signer=32 bytes] [era=1 byte] [nonce compact] [tip compact] [call]
  var version = new Uint8Array([0x84]);
  var signerPubkey = new Uint8Array(kp.publicKey);
  
  var extrinsic = concatBytes(version, signature, signerPubkey, era, nonceEncoded, tip, callBytes);
  
  // 5. Add compact length prefix
  var lengthPrefix = compactEncode(extrinsic.length);
  var finalExtrinsic = concatBytes(lengthPrefix, extrinsic);
  
  return bytesToHex(finalExtrinsic);
}


// ============================================================
// JavaScript Interface for Android WebView (called from Kotlin)
// ============================================================
var VerdisSigner = {
  isReady: function() {
    return window._polkadotReady === true;
  },
  
  deriveAddress: function(mnemonic) {
    try {
      if (!window._polkadotReady) {
        return JSON.stringify({ error: "WASM_NOT_READY" });
      }
      var kp = VerdisCrypto.deriveKeypair(mnemonic);
      var address = kp.address;
      var publicKeyHex = Array.from(kp.publicKey).map(function(b) {
        return (b < 16 ? "0" : "") + b.toString(16);
      }).join("");
      // Return empty secretKey for backward compat (Flutter ignores it)
      return JSON.stringify({
        address: address,
        publicKey: publicKeyHex,
        secretKey: ""
      });
    } catch(e) {
      return JSON.stringify({ error: e.message });
    }
  },
  
  generateMnemonic: function() {
    return VerdisCrypto.generateMnemonic();
  },
  
  validateMnemonic: function(mnemonic) {
    try {
      return VerdisCrypto.validateMnemonic(mnemonic);
    } catch(e) {
      return false;
    }
  },
  
  signTransfer: function(mnemonic, destAddress, amountAtoms, nonce, genesisHash, blockHash, specVersion) {
    try {
      if (!window._polkadotReady) {
        return JSON.stringify({ error: WASM_NOT_READY });
      }
      // Call async function and return result
      // Since evaluateJavascript doesn't support promises, we need a callback approach
      // For now, use a synchronous approach by pre-signing
      var keyring = new PolkadotCrypto.Keyring({ type: sr25519, ss58Format: 909 });
      var kp = keyring.addFromMnemonic(mnemonic);
      
      // Create the call bytes
      var callBytes = createTransferCall(destAddress, amountAtoms);
      
      // Create signing payload
      var era = new Uint8Array([0x00]);
      var nonceEncoded = compactEncode(nonce);
      var tip = new Uint8Array([0x00]);
      var specVerBytes = new Uint8Array(4);
      specVerBytes[0] = specVersion & 0xff;
      specVerBytes[1] = (specVersion >> 8) & 0xff;
      specVerBytes[2] = (specVersion >> 16) & 0xff;
      specVerBytes[3] = (specVersion >> 24) & 0xff;
      var genHash = hexToUint8(genesisHash);
      var blkHash = hexToUint8(blockHash);
      
      var signingPayload = concatBytes(callBytes, era, nonceEncoded, tip, specVerBytes, genHash, blkHash);
      
      // Sign
      var signature = kp.sign(signingPayload);
      var signerPubkey = new Uint8Array(kp.publicKey);
      
      // Create extrinsic
      var version = new Uint8Array([0x84]);
      var extrinsic = concatBytes(version, signature, signerPubkey, era, nonceEncoded, tip, callBytes);
      var lengthPrefix = compactEncode(extrinsic.length);
      var finalExtrinsic = concatBytes(lengthPrefix, extrinsic);
      
      return JSON.stringify({
        extrinsic: 0x + bytesToHex(finalExtrinsic),
        signer: kp.address
      });
    } catch(e) {
      return JSON.stringify({ error: e.message });
    }
  }
};

// Signal that the page is ready
window._verdisSignerReady = true;
console.log("[VerdisSigner] Ready (waiting for WASM init)");
