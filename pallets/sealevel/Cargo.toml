[package]
name = "pallet-sealevel"
version = "0.1.0"
description = "Parallel smart contract execution inspired by Solana's Sealevel"
license = "MIT"
edition = "2021"
publish = false

[dependencies]
codec = { workspace = true, features = ["derive", "max-encoded-len"] }
scale-info = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive", "alloc"] }
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-std = { workspace = true }
sp-runtime = { workspace = true }

[features]
default = ["std"]
std = ["codec/std", "scale-info/std", "serde/std", "frame-support/std", "frame-system/std", "sp-std/std", "sp-runtime/std"]
runtime-benchmarks = ["frame-support/runtime-benchmarks", "frame-system/runtime-benchmarks"]
try-runtime = ["frame-support/try-runtime"]
