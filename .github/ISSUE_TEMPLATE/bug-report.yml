name: Bug Report
description: Report a bug in Verdis Chain
title: '[BUG] '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out all fields.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run command X
        2. Observe output Y
        3. Expected Z
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Node version
      placeholder: 'verdis --version'
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (consensus/security)
        - High (blocks usage)
        - Medium (degraded performance)
        - Low (cosmetic)
    validations:
      required: true
