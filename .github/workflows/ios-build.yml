name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS App (simulator, no signing)
        run: |
          flutter build ios --debug --simulator --no-codesign

      - name: Package as IPA (simulator)
        run: |
          cd build/ios/iphonesimulator
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../verdis-wallet-ios-simulator.ipa Payload
          cd ../..
          ls -lh verdis-wallet-ios-simulator.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: verdis-wallet-ios-simulator
          path: verdis-wallet-ios-simulator.ipa
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build/ios/**/*.log
          retention-days: 7
