name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.0'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (debug for CI verification)
        run: flutter build apk --debug || true

      - name: Find and list APK files
        run: |
          echo "=== Looking for APK files ==="
          find build -name "*.apk" -type f 2>/dev/null || echo "No APK in build/"
          find /home/runner -name "*.apk" -type f 2>/dev/null | head -5 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: verdis-wallet-android-debug
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-output
          path: build/app/
          retention-days: 7
          if-no-files-found: warn
