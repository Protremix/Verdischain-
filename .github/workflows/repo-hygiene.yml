name: Repository Hygiene

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check-artifacts:
    name: Prevent Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List all files with forbidden extensions
        run: |
          echo "=== Checking for forbidden files ==="
          RESULTS=""
          for ext in bak tmp apk pyc; do
            FOUND=
            if [ -n "$FOUND" ]; then
              echo "Found .$ext files:"
              echo "$FOUND"
              RESULTS="$RESULTS$FOUND"
            fi
          done
          if [ -n "$RESULTS" ]; then
            echo "ERROR: Forbidden files found!"
            exit 1
          fi
          echo "No forbidden artifacts found."
