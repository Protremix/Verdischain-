name: Repository Hygiene

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check-artifacts:
    name: Prevent Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for forbidden file types
        run: |
          set -x
          FORBIDDEN= 2>/dev/null)
          echo FORBIDDEN=
          if [ -n  ]; then
            echo ERROR: Forbidden build/temp artifacts found in repository:
            echo 
            exit 1
          fi
          echo No forbidden artifacts found.
