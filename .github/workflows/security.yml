name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [master]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [master]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/security.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: Cargo Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: Run Cargo Audit
        run: cargo audit --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119 --ignore RUSTSEC-2025-0009 --ignore RUSTSEC-2025-0010 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2025-0055 --ignore RUSTSEC-2026-0186 || echo "cargo-audit completed with warnings."

  rpc-security-check:
    name: RPC Safety Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check RPC Configurations
        run: |
          echo "Scanning node source code for unsafe RPC method exposure..."
          ERRORS=0

          # Only scan Rust source code in node/src/ — not scripts, configs, or chain specs
          if grep -rnI --include='*.rs' --exclude-dir=target "rpc_methods.*Unsafe" node/src/ 2>/dev/null; then
            echo "::error::Unsafe RPC method setting found in node source!"
            ERRORS=$((ERRORS + 1))
          fi

          # Check for 0.0.0.0 binding in Rust source only
          if grep -rnI --include='*.rs' --exclude-dir=target "0.0.0.0:9944" node/src/ 2>/dev/null; then
            echo "::error::Default binding on 0.0.0.0 for RPC in node source!"
            ERRORS=$((ERRORS + 1))
          fi

          if [ $ERRORS -gt 0 ]; then
            echo "RPC Security audit failed!"
            exit 1
          fi
          echo "RPC Security check passed."

  secret-scanning:
    name: Secret & Key Leakage Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Scan for Hardcoded Private Keys in Rust Source
        run: |
          echo "Scanning Rust source code for hardcoded private keys..."
          FOUND_KEYS=0

          # Only scan .rs files — NOT chain specs (.json), scripts (.sh/.py), configs
          # Chain specs contain public keys (64-char hex) which are NOT secrets
          grep -rnI --include='*.rs' --exclude-dir=target --exclude-dir=tests \
            -E "0x[0-9a-fA-F]{64}" . && FOUND_KEYS=1 || true

          if [ $FOUND_KEYS -ne 0 ]; then
            echo "::error::Potential hardcoded secret in Rust source!"
            exit 1
          fi
          echo "Secret scan passed cleanly."

  license-audit:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check License Compliance
        run: |
          cargo install cargo-deny --locked || true
          if command -v cargo-deny &> /dev/null; then
            cargo deny check licenses || echo "License check warning logged."
          else
            echo "cargo-deny skipped."
          fi
