name: Secret Scanning

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  secret-scan:
    name: Scan for Exposed Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for private keys and seeds
        run: |
          echo "=== Scanning for exposed secrets ==="
          ERRORS=0
          
          # Check for sensitive files
          SENSITIVE_FILES=(
            "validator-keys.json"
            "multi-node/keys/"
            "mainnet-key-config.json"
          )
          for pattern in "${SENSITIVE_FILES[@]}"; do
            if find . -not -path './.git/*' -not -path './node_modules/*' -not -path './target/*' -name "$pattern" -type f 2>/dev/null | grep -q .; then
              echo "FAIL: Sensitive file found: $pattern"
              ERRORS=$((ERRORS + 1))
            fi
          done
          
          # Check for 64-char hex seeds in KEY files only (not chain specs, tests, or code)
          SEED_HITS=$(grep -r --include='*.json' -E '"secretSeed"|"secretPhrase"|"privateKey"|"seed": "0x[0-9a-fA-F]{64}"' . 2>/dev/null | grep -v 'node_modules\|target\|\.git\|package-lock\|Cargo.lock\|chain-spec\|test' | wc -l)
          if [ $SEED_HITS -gt 0 ]; then
            echo "FAIL: Found $SEED_HITS potential seed values (64-char hex strings)"
            grep -r --include='*.json' --include='*.txt' --include='*.py' --include='*.js' --include='*.ts' --include='*.rs' -E '0x[0-9a-fA-F]{64}' . 2>/dev/null | grep -v 'node_modules\|target\|\.git\|package-lock\|Cargo.lock' | head -5
            ERRORS=$((ERRORS + 1))
          fi
          
          # Check for JSON keys with 'secretSeed' or 'phrase'
          SECRET_KEY_HITS=$(grep -r --include='*.json' -E '"secretSeed"|"secretPhrase"|"privateKey"' . 2>/dev/null | grep -v 'node_modules\|target\|\.git' | wc -l)
          if [ $SECRET_KEY_HITS -gt 0 ]; then
            echo "FAIL: Found $SECRET_KEY_HITS JSON files with secret key fields"
            ERRORS=$((ERRORS + 1))
          fi
          
          # Check for .node.key files
          NODE_KEY_HITS=$(find . -not -path './.git/*' -name '*.node.key' -type f 2>/dev/null | wc -l)
          if [ $NODE_KEY_HITS -gt 0 ]; then
            echo "FAIL: Found $NODE_KEY_HITS .node.key files"
            ERRORS=$((ERRORS + 1))
          fi
          
          if [ $ERRORS -eq 0 ]; then
            echo "PASS: No exposed secrets detected."
            exit 0
          else
            echo "FAIL: $ERRORS secret exposure issue(s) found."
            exit 1
          fi
