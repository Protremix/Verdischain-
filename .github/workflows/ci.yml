name: Verdis Chain CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Step 1: Format check
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Step 2: Compilation check
  check:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=$(find /usr/lib -name "libclang*.so" -printf "%h/" 2>/dev/null | head -1)" >> $GITHUB_ENV
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Cargo check
        run: cargo check --workspace --all-targets

  # Step 3: Clippy (strict)
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=$(find /usr/lib -name "libclang*.so" -printf "%h/" 2>/dev/null | head -1)" >> $GITHUB_ENV
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Step 4: Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=$(find /usr/lib -name "libclang*.so" -printf "%h/" 2>/dev/null | head -1)" >> $GITHUB_ENV
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Run tests
        run: cargo test --workspace --verbose

  # Step 5: Release build
  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=$(find /usr/lib -name "libclang*.so" -printf "%h/" 2>/dev/null | head -1)" >> $GITHUB_ENV
      - name: Build release binary
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: verdis-node-binary
          path: target/release/verdis
          retention-days: 7

  # Step 6: WASM runtime build
  wasm-build:
    name: WASM Runtime Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=$(find /usr/lib -name "libclang*.so" -printf "%h/" 2>/dev/null | head -1)" >> $GITHUB_ENV
      - name: Build WASM runtime
        run: cargo build --release -p verdis-runtime --no-default-features --target wasm32-unknown-unknown
      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: verdis-runtime-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: warn
          retention-days: 7

  # Step 7: Dependency audit
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run audit
        run: scripts/cargo-audit-safe.sh --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119 --ignore RUSTSEC-2025-0009 --ignore RUSTSEC-2025-0010 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2025-0055 --ignore RUSTSEC-2024-0388 --ignore RUSTSEC-2025-0057
