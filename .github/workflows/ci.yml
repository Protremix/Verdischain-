name: Verdis Chain CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set LIBCLANG_PATH
        run: |
          LCP=$(find /usr/lib -name "libclang*.so" -printf "%h/" 2>/dev/null | head -1)
          echo "LIBCLANG_PATH=$LCP" >> $GITHUB_ENV
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Cargo check
        run: |
          cargo check --workspace --all-targets 2>&1 | tee /tmp/cargo-check.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            ERRORS=$(grep -E "^error" /tmp/cargo-check.log | head -50)
            echo "ERRORS_START"
            echo "$ERRORS"
            echo "ERRORS_END"
            # Post errors as commit comment for debugging
            python3 -c "
          import json, os, urllib.request
          errors = os.environ.get(ERRORS,)
          if errors:
              body = ## Cargo check errorsn```n + errors + n```
              data = json.dumps({body: body}).encode()
              req = urllib.request.Request(
                  https://api.github.com/repos/ + os.environ[GITHUB_REPOSITORY] + /commits/ + os.environ[GITHUB_SHA] + /comments,
                  data=data,
                  headers={Authorization: token  + os.environ[GITHUB_TOKEN], Content-Type: application/json}
              )
              try:
                  urllib.request.urlopen(req)
                  print(Posted errors as commit comment)
              except Exception as e:
                  print(Failed to post comment:, e)
          "
          fi
          exit $EXIT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ERRORS: ${{ steps.cargo-check.outputs.errors }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Set LIBCLANG_PATH
        run: |
          LCP=$(find /usr/lib -name "libclang*.so" -printf "%h/" 2>/dev/null | head -1)
          echo "LIBCLANG_PATH=$LCP" >> $GITHUB_ENV
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Clippy check
        run: |
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            ERRORS=$(grep -E "^error" /tmp/clippy.log | head -50)
            python3 -c "
          import json, os, urllib.request
          errors = 
          if errors:
              body = ## Clippy errorsn```n + errors + n```
              data = json.dumps({body: body}).encode()
              req = urllib.request.Request(
                  https://api.github.com/repos/ + os.environ[GITHUB_REPOSITORY] + /commits/ + os.environ[GITHUB_SHA] + /comments,
                  data=data,
                  headers={Authorization: token  + os.environ[GITHUB_TOKEN], Content-Type: application/json}
              )
              try:
                  urllib.request.urlopen(req)
                  print(Posted errors as commit comment)
              except Exception as e:
                  print(Failed to post comment:, e)
          "
          fi
          exit $EXIT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set LIBCLANG_PATH
        run: |
          LCP=$(find /usr/lib -name "libclang*.so" -printf "%h/" 2>/dev/null | head -1)
          echo "LIBCLANG_PATH=$LCP" >> $GITHUB_ENV
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - run: cargo test --workspace --verbose

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set LIBCLANG_PATH
        run: |
          LCP=$(find /usr/lib -name "libclang*.so" -printf "%h/" 2>/dev/null | head -1)
          echo "LIBCLANG_PATH=$LCP" >> $GITHUB_ENV
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: verdis-node-binary
          path: target/release/verdis
          retention-days: 7

  wasm-build:
    name: WASM Runtime Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Set LIBCLANG_PATH
        run: |
          LCP=$(find /usr/lib -name "libclang*.so" -printf "%h/" 2>/dev/null | head -1)
          echo "LIBCLANG_PATH=$LCP" >> $GITHUB_ENV
      - run: cargo build --release -p verdis-runtime --no-default-features --target wasm32-unknown-unknown
      - uses: actions/upload-artifact@v4
        with:
          name: verdis-runtime-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: warn
          retention-days: 7

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit
      - run: scripts/cargo-audit-safe.sh --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119 --ignore RUSTSEC-2025-0009 --ignore RUSTSEC-2025-0010 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2025-0055 --ignore RUSTSEC-2024-0388 --ignore RUSTSEC-2025-0057
