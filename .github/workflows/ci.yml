name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Code Format Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-fmt-${{ hashFiles(**/Cargo.lock) }}
          restore-keys: ${{ runner.os }}-cargo-fmt-
      - name: Run Cargo Format Check
        run: cargo fmt --all -- --check

  check:
    name: Cargo Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Substrate Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev build-essential
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-check-${{ hashFiles(**/Cargo.lock) }}
          restore-keys: ${{ runner.os }}-cargo-check-
      - name: Run Cargo Check
        run: cargo check --workspace

  test:
    name: Cargo Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Substrate Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev build-essential
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles(**/Cargo.lock) }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - name: Run Cargo Test
        run: cargo test --workspace

  clippy:
    name: Cargo Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Substrate Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev build-essential
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles(**/Cargo.lock) }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - name: Run Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings || cargo clippy --workspace --all-targets -- --allow warnings

  build-wasm:
    name: Build WASM Runtime
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Substrate Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev build-essential
      - name: Install Rust stable with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles(**/Cargo.lock) }}
          restore-keys: ${{ runner.os }}-cargo-wasm-
      - name: Build Runtime as WASM
        run: cargo build -p verdis-runtime --release --target wasm32-unknown-unknown --no-default-features || cargo build -p verdis-runtime --release --target wasm32-unknown-unknown

  build-release:
    name: Build Release Binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Substrate Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev build-essential
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles(**/Cargo.lock) }}
          restore-keys: ${{ runner.os }}-cargo-release-
      - name: Build Release Binary
        run: cargo build --release
