name: Release Gates

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  fmt:
    name: 1. Code Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: 2. Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Set LIBCLANG_PATH
        run: |
          LCP=$(find /usr/lib -name "libclang*.so" -printf "%h\n" 2>/dev/null | sort -u | tr '\n' ':' | sed 's/:$//')
          echo "LIBCLANG_PATH=$LCP" >> $GITHUB_ENV
          echo "Found LIBCLANG_PATH=$LCP"
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: 3. Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set LIBCLANG_PATH
        run: |
          LCP=$(find /usr/lib -name "libclang*.so" -printf "%h\n" 2>/dev/null | sort -u | tr '\n' ':' | sed 's/:$//')
          echo "LIBCLANG_PATH=$LCP" >> $GITHUB_ENV
      - run: cargo test --workspace --exclude verdis-node

  tokenomics-check:
    name: 4. Tokenomics Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_genesis_consistency.py

  release-build:
    name: 5. Release Build
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, tokenomics-check]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set LIBCLANG_PATH
        run: |
          LCP=$(find /usr/lib -name "libclang*.so" -printf "%h\n" 2>/dev/null | sort -u | tr '\n' ':' | sed 's/:$//')
          echo "LIBCLANG_PATH=$LCP" >> $GITHUB_ENV
      - run: cargo build --release --workspace 2>&1 | tail -5

  wasm-build:
    name: 6. WASM Runtime Build
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, tokenomics-check]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Set LIBCLANG_PATH
        run: |
          LCP=$(find /usr/lib -name "libclang*.so" -printf "%h\n" 2>/dev/null | sort -u | tr '\n' ':' | sed 's/:$//')
          echo "LIBCLANG_PATH=$LCP" >> $GITHUB_ENV
      - run: cargo build --release --target wasm32-unknown-unknown -p verdis-runtime 2>&1 | tail -5

  repo-hygiene:
    name: 7. Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for forbidden files
        run: |
          RESULTS=""
          for ext in bak tmp apk pyc; do
            FOUND=$(find . -name "*.$ext" -not -path "./.git/*" -not -path "./target/*" -not -path "./node_modules/*" 2>/dev/null)
            if [ -n "$FOUND" ]; then
              echo "Found .$ext files:"
              echo "$FOUND"
              RESULTS="$RESULTS$FOUND"
            fi
          done
          if [ -n "$RESULTS" ]; then
            echo "FAIL: Forbidden files found"
            exit 1
          fi
          echo "OK: No forbidden files"

  release-gates-summary:
    name: RELEASE GATES SUMMARY
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, tokenomics-check, release-build, wasm-build, repo-hygiene]
    steps:
      - run: echo "All 7 release gates passed. Merge to master is approved."
