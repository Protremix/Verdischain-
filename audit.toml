# Verdis Chain Cargo Audit Configuration
# 
# These advisories are in transitive dependencies of the Substrate framework
# that we cannot directly upgrade. They are reviewed and accepted.
# New vulnerabilities NOT in this list WILL fail the CI/CD pipeline.

[advisories]
ignore = [
    # hickory-proto (DNS library, Substrate transitive dep)
    "RUSTSEC-2026-0118",  # NSEC3 unbounded loop - no fix available
    "RUSTSEC-2026-0119",  # CPU exhaustion O(n²) - fix requires Substrate upgrade
    
    # ring (crypto library, Substrate transitive dep)
    "RUSTSEC-2025-0009",  # AES panic with overflow checking
    "RUSTSEC-2025-0010",  # ring <0.17 unmaintained
    
    # rustls-webpki (TLS library, Substrate transitive dep)
    "RUSTSEC-2026-0098",  # Name constraints for URI names
    "RUSTSEC-2026-0099",  # Name constraints wildcard
    "RUSTSEC-2026-0104",  # CRL parsing panic
    
    # tracing-subscriber (Substrate transitive dep)
    "RUSTSEC-2025-0055",  # ANSI escape sequence in logs
    
    # Unmaintained crates (warnings, not vulnerabilities)
    "RUSTSEC-2022-0061",  # parity-wasm deprecated
    "RUSTSEC-2024-0370",  # proc-macro-error unmaintained
    "RUSTSEC-2024-0384",  # instant unmaintained
    "RUSTSEC-2024-0388",  # derivative unmaintained
    "RUSTSEC-2024-0436",  # paste unmaintained
    "RUSTSEC-2025-0057",  # fxhash unmaintained
    "RUSTSEC-2025-0161",  # libsecp256k1 unmaintained
    "RUSTSEC-2026-0173",  # proc-macro-error2 unmaintained
    "RUSTSEC-2026-0186",  # memmap2 unsound
    "RUSTSEC-2026-0002",  # lru IterMut unsound
    "RUSTSEC-2026-0253",  # lru use-after-free
]
