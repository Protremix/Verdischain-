[package]
name = "verdis-runtime"
version = "2.0.0"
description = "Runtime for Verdis Chain — BABE+GRANDPA consensus, WASM contracts, eco-tracking"
license = "MIT"
edition = "2021"
publish = false

[dependencies]
codec = { workspace = true, features = ["derive", "max-encoded-len"] }
scale-info = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive", "alloc"] }
serde_json = { workspace = true, features = ["alloc"] }

# Substrate core
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-executive = { workspace = true }
frame-try-runtime = { workspace = true, optional = true }
frame-benchmarking = { workspace = true, optional = true }

sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-io = { workspace = true }
sp-std = { workspace = true }
sp-api = { workspace = true }
sp-block-builder = { workspace = true }
sp-genesis-builder = { workspace = true, default-features = false }
sp-consensus-babe = { workspace = true }
sp-consensus-grandpa = { workspace = true }
sp-inherents = { workspace = true }
sp-offchain = { workspace = true }
sp-session = { workspace = true }
sp-staking = { workspace = true }
sp-transaction-pool = { workspace = true }
sp-version = { workspace = true }
sp-timestamp = { workspace = true }
sp-application-crypto = { workspace = true }

# Solana-inspired pallets
pallet-poh = { path = "../pallets/poh", default-features = false }
pallet-gulf-stream = { path = "../pallets/gulf-stream", default-features = false }
pallet-turbine = { path = "../pallets/turbine", default-features = false }
pallet-zk-compression = { path = "../pallets/zk-compression", default-features = false }
pallet-address-lookup-tables = { path = "../pallets/address-lookup-tables", default-features = false }
pallet-circuit-breaker = { path = "../pallets/circuit-breaker", default-features = false }
pallet-sealevel = { path = "../pallets/sealevel", default-features = false }
pallet-ibc = { path = "../pallets/ibc", default-features = false }

# Core pallets
pallet-babe = { workspace = true }
pallet-authorship = { workspace = true }
pallet-grandpa = { workspace = true }
pallet-balances = { workspace = true }
pallet-sudo = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-transaction-payment = { workspace = true }
pallet-session = { workspace = true }
pallet-offences = { workspace = true }
pallet-scheduler = { workspace = true }
pallet-preimage = { workspace = true }

# WASM Smart Contracts
pallet-contracts = { workspace = true }
pallet-nfts = { version = "43.0.0", default-features = false }
pallet-multisig = { version = "49.0.0", default-features = false }
pallet-proxy = { version = "49.0.0", default-features = false }

# Governance and Treasury
pallet-collective = { version = "49.0.0", default-features = false }
pallet-democracy = { version = "49.0.0", default-features = false }
pallet-utility = { version = "49.0.0", default-features = false }
pallet-treasury = { version = "48.0.0", default-features = false }

# Contracts RPC Runtime API
# pallet-contracts-rpc-runtime-api removed — trait declared in runtime
# RPC Runtime APIs
frame-system-rpc-runtime-api = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true }

# Verdis custom pallets
pallet-dpos = { path = "../pallets/dpos", default-features = false }
pallet-amm-dex = { path = "../pallets/amm-dex", default-features = false }
pallet-eco = { path = "../pallets/eco", default-features = false }
pallet-fungible-tokens = { path = "../pallets/fungible-tokens", default-features = false }
pallet-tokenomics = { path = "../pallets/tokenomics", default-features = false }
pallet-vesting = { path = "../pallets/vesting", default-features = false }
pallet-presale = { path = "../pallets/presale", default-features = false }
pallet-storage = { path = "../pallets/storage", default-features = false }

[build-dependencies]
substrate-wasm-builder = { workspace = true }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-support/std",
    "frame-system/std",
    "frame-executive/std",
    "frame-try-runtime?/std",
    "sp-core/std",
    "sp-runtime/std",
    "sp-io/std",
    "sp-std/std",
    "sp-api/std",
    "sp-block-builder/std",
    "sp-genesis-builder/std",
    "sp-consensus-babe/std",
    "sp-consensus-grandpa/std",
    "sp-inherents/std",
    "sp-offchain/std",
    "sp-session/std",
    "sp-staking/std",
    "sp-transaction-pool/std",
    "sp-version/std",
    "sp-timestamp/std",
    "sp-application-crypto/std",
    "pallet-authorship/std",
    "pallet-babe/std",
    "pallet-grandpa/std",
    "pallet-balances/std",
    "pallet-sudo/std",
    "pallet-timestamp/std",
    "pallet-transaction-payment/std",
    "pallet-session/std",
    "pallet-offences/std",
    "pallet-scheduler/std",
    "pallet-preimage/std",
    "pallet-contracts/std",
    "pallet-utility/std",
    "pallet-democracy/std",
    "pallet-treasury/std",
    "pallet-collective/std",
    "pallet-proxy/std",
    "pallet-multisig/std",
    "pallet-nfts/std",
    "frame-system-rpc-runtime-api/std",
    "pallet-transaction-payment-rpc-runtime-api/std",
    "pallet-dpos/std",
    "pallet-amm-dex/std",
    "pallet-eco/std",
    "pallet-fungible-tokens/std",
    "pallet-tokenomics/std",
    "pallet-vesting/std",
	"pallet-presale/std",
    "pallet-storage/std",
    "pallet-circuit-breaker/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "pallet-balances/runtime-benchmarks",
    "pallet-timestamp/runtime-benchmarks",
    "pallet-contracts/runtime-benchmarks",
    "pallet-dpos/runtime-benchmarks",
    "pallet-amm-dex/runtime-benchmarks",
    "pallet-eco/runtime-benchmarks",
    "pallet-tokenomics/runtime-benchmarks",
    "pallet-vesting/runtime-benchmarks",
    "pallet-presale/runtime-benchmarks",
    "pallet-fungible-tokens/runtime-benchmarks",
    "pallet-collective/runtime-benchmarks",
    "pallet-democracy/runtime-benchmarks",
    "pallet-multisig/runtime-benchmarks",
    "pallet-proxy/runtime-benchmarks",
    "pallet-utility/runtime-benchmarks",
    "pallet-nfts/runtime-benchmarks",
    "pallet-scheduler/runtime-benchmarks",
    "pallet-preimage/runtime-benchmarks",
    "pallet-sudo/runtime-benchmarks",
    "pallet-babe/runtime-benchmarks",
    "pallet-grandpa/runtime-benchmarks",
    "pallet-session/runtime-benchmarks",
    "pallet-transaction-payment/runtime-benchmarks",
]
try-runtime = [
    "frame-try-runtime/try-runtime",
    "frame-system/try-runtime",
    "pallet-balances/try-runtime",
    "pallet-babe/try-runtime",
    "pallet-grandpa/try-runtime",
    "pallet-timestamp/try-runtime",
    "pallet-transaction-payment/try-runtime",
    "pallet-sudo/try-runtime",
    "pallet-session/try-runtime",
    "pallet-scheduler/try-runtime",
    "pallet-preimage/try-runtime",
    "pallet-contracts/try-runtime",
    "pallet-dpos/try-runtime",
    "pallet-amm-dex/try-runtime",
    "pallet-eco/try-runtime",
    "pallet-tokenomics/try-runtime",
    "pallet-vesting/try-runtime",
    "pallet-presale/try-runtime",
    "pallet-storage/try-runtime",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }
