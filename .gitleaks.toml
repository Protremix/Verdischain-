title = "Verdis Chain Secret Scanning"

[extend]
useDefault = true

[[rules]]
id = "verdis-seeds"
description = "Substrate seed values"
regex = '''0x[0-9a-fA-F]{64}'''
tags = ["seed", "substrate"]

[[rules]]
id = "verdis-mnemonics"
description = "Mnemonic phrases in JSON"
regex = '''"secretPhrase"|"secretSeed"|"privateKey"'''
tags = ["mnemonic", "key"]
