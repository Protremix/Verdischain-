[package]
name = "verdis-chain"
version = "2.0.0"
description = "Verdis — The world's first fully green, carbon-negative blockchain ecosystem"
license = "MIT"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "verdis"
path = "src/main.rs"


[dependencies]
codec = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
log = "0.4"
tokio = { version = "1.40", features = ["full"] }
jsonrpsee = { version = "0.24", features = ["server", "macros"] }

# Substrate core
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-io = { workspace = true }
sp-block-builder = { workspace = true }
sp-blockchain = { workspace = true }
sp-consensus-babe = { workspace = true }
sp-consensus-grandpa = { workspace = true }
sp-consensus = { version = "0.41.0" }
sp-inherents = { workspace = true }
sp-keyring = { workspace = true }
sp-keystore = { version = "0.45.0" }
sp-offchain = { workspace = true }
sp-session = { workspace = true }
sp-timestamp = { workspace = true }
sp-transaction-pool = { workspace = true }
sp-api = { workspace = true }
sp-version = { workspace = true }
sp-application-crypto = { workspace = true }

# Verdis runtime
verdis-runtime = { path = "../runtime" }
hex-literal = "0.4.1"

# Verdis pallets (for RPC type access)
pallet-amm-dex = { path = "../pallets/amm-dex" }
pallet-dpos = { path = "../pallets/dpos" }
pallet-eco = { path = "../pallets/eco" }
pallet-tokenomics = { path = "../pallets/tokenomics" }
pallet-sudo = { workspace = true }

# Client
sc-cli = { version = "0.61.0" }
sc-client-api = { version = "47.0.0" }
sc-consensus = { version = "0.57.0" }
sc-consensus-babe = { version = "0.58.0" }
sc-consensus-grandpa = { version = "0.43.0" }
sc-consensus-slots = { version = "0.57.0" }
sc-executor = { version = "0.50.0" }
sc-basic-authorship = { version = "0.56.0" }
sc-chain-spec = { version = "51.0.0" }
sc-keystore = { version = "42.0.0" }
sc-network = { version = "0.58.0" }
sc-rpc = { version = "54.0.0" }
sc-rpc-api = { version = "0.58.0" }
sc-rpc-server = { version = "31.0.0" }
sc-service = { version = "0.60.0" }
sc-telemetry = { version = "33.0.0" }
sc-transaction-pool = { version = "47.0.0" }
sc-transaction-pool-api = { version = "46.0.0" }
sc-utils = { version = "23.0.0" }
substrate-frame-rpc-system = { version = "53.0.0" }
pallet-transaction-payment-rpc = { version = "52.0.0" }
pallet-transaction-payment-rpc-runtime-api = { version = "49.0.0" }
substrate-prometheus-endpoint = { version = "0.17.7" }
frame-benchmarking-cli = { version = "58.0.0", default-features = false, features = ["rocksdb"] }
pallet-staking = { version = "49.0.0", default-features = false, optional = true }

[build-dependencies]
substrate-build-script-utils = { workspace = true }

[features]
default = []
runtime-benchmarks = ["verdis-runtime/runtime-benchmarks", "pallet-staking/runtime-benchmarks"]
try-runtime = ["verdis-runtime/try-runtime"]
