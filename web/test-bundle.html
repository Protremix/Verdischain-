<!DOCTYPE html>
<html>
<head><title>Bundle Test</title></head>
<body>
<div id="result">Loading...</div>
<script src="https://verdischain.com/polkadot-crypto-bundle.js"></script>
<script>
(async () => {
  try {
    await PolkadotCrypto.cryptoWaitReady();
    const keyring = new PolkadotCrypto.Keyring({ type: "sr25519", ss58Format: 909 });
    const mn = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about";
    const kp = keyring.addFromMnemonic(mn);
    document.getElementById("result").innerHTML = "Address: " + kp.address + "<br>Pubkey: " + Array.from(kp.publicKey).map(b => b.toString(16).padStart(2,"0")).join("");
  } catch(e) {
    document.getElementById("result").innerHTML = "Error: " + e.message;
  }
})();
</script>
</body>
</html>
