<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f1f5f9;color:#0f172a;font-family:system-ui,sans-serif;padding:32px
--hero-bg: #1a1a1a;}
h1{font-size:13px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;max-width:800px;margin:0 auto}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:20px}
.card h2{font-size:14px;color:#334155;text-transform:uppercase;margin-bottom:8px}
.value{font-size:14px;font-weight:700;color:#caff33}
.ok{color:#22c55e}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* Mobile responsiveness */
@media(max-width:375px){.nav{padding:8px 12px}.nav-links{gap:8px;font-size:12px}.nav-links a{font-size:12px}.container{padding:16px}.wallet-grid,.dex-grid{grid-template-columns:1fr}.stats-row{grid-direction:column}.stat{min-width:100px}.btn{min-height:64px;padding:10px 16px}.card{padding:16px}h1{font-size:13px}}
@media(max-width:768px){.nav-links{gap:10px}.nav-brand{font-size:14px}.container{padding:20px}}
</style>

<style>
.footer{max-width:1200px;margin:0 auto;padding:32px 24px;border-top:1px solid rgba(0,0,0,0.08);margin-top:40px}
.footer-social{display:flex;gap:10px;margin-top:16px}.footer-social a{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;color:var(--text-muted,#94a3b8);transition:all .2s}.footer-social a:hover{color:#fff;background:rgba(255,255,255,0.1)}
.footer-links{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:12px;justify-content:center}
.footer-links a{font-size:12px;color:#475569;text-decoration:none;transition:color .2s}
.footer-links a:hover{color:#16a34a}
.footer-copy{font-size:11px;color:#94a3b8;text-align:center}
</style>
<link rel="icon" type="image/png" href="/assets/favicon.png" />
</head>
<body>
<nav style="position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid #e2e8f0">
  <div style="max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;gap:16px">
    <a href="/" style="display:flex;align-items:center;gap:8px;text-decoration:none">
      <img src="/assets/verdis-logo-black.png" alt="Verdis Chain" style="height:32px;width:auto">
    </a>
    <div style="display:flex;gap:4px;flex-wrap:wrap">
      <a href="/explorer/" style="padding:6px 10px;font-size:12px;font-weight:500;color:#475569;border-radius:8px;text-decoration:none">Verdiscan</a>
      <a href="/dex/" style="padding:6px 10px;font-size:12px;font-weight:500;color:#475569;border-radius:8px;text-decoration:none">DEX</a>
      <a href="/whitepaper/" style="padding:6px 10px;font-size:12px;font-weight:500;color:#475569;border-radius:8px;text-decoration:none">Whitepaper</a>
      <a href="/wallet/" style="padding:6px 10px;font-size:12px;font-weight:500;color:#475569;border-radius:8px;text-decoration:none">Wallet</a>
      <a href="/faucet/" style="padding:6px 10px;font-size:12px;font-weight:500;color:#475569;border-radius:8px;text-decoration:none">Faucet</a>
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#475569">
      <div style="width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;animation:pulse 2s infinite"></div>
      <span>Connected</span>
    </div>
  </div>
</nav>
<h1 style="text-align:center;margin-top:24px">🟢 Verdis Chain Status</h1>
<div class="grid" id="stats"></div>
<script>
fetch('/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'chain_getHeader',params:[],id:1})})
.then(r=>r.json()).then(d=>{document.getElementById('stats').innerHTML+=card('Block Height','#'+parseInt(d.result.number,16),'ok')});
fetch('/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'system_health',params:[],id:2})})
.then(r=>r.json()).then(d=>{document.getElementById('stats').innerHTML+=card('Peers',d.result.peers,'ok')});
fetch('/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'amm_dex_getPoolCount',params:[],id:3})})
.then(r=>r.json()).then(d=>{document.getElementById('stats').innerHTML+=card('AMM Pools',d.result||0,'ok')});
document.getElementById('stats').innerHTML+=card('Services','13/13','ok');
document.getElementById('stats').innerHTML+=card('Validators','14','ok');
document.getElementById('stats').innerHTML+=card('Network','Testnet','ok');
function card(label,value,cls){return '<div class="card"><h2>'+label+'</h2><div class="value '+cls+' pulse">'+value+'</div></div>'}
</script>
