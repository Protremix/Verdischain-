[package]
name = "verdis-core"
version = "2.0.0"
edition = "2021"
description = "Verdis blockchain wallet core — shared library for all platforms"
license = "MIT"

[lib]
name = "verdis_core"
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["native"]
native = ["dep:reqwest", "dep:tokio"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]

[dependencies]
ed25519-dalek = { version = "1.0", features = ["batch"] }
blake2 = "0.10"
twox-hash = "1.6"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bs58 = "0.5"
parity-scale-codec = { version = "3.6", features = ["derive"] }
thiserror = "1.0"
log = "0.4"
rand = "0.7"

# Native-only (optional)
reqwest = { version = "0.11", features = ["json", "blocking"], optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }

# WASM-only (optional)
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Response", "Headers"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
