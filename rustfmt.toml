# Rustfmt Configuration for Verdis Chain

edition = "2021"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"

# Import Management (stable only)
reorder_imports = true
reorder_modules = true

# Code Simplification
use_field_init_shorthand = true
use_try_shorthand = true
remove_nested_parens = true
